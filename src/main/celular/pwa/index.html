<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#e9dfc8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121019" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Oráculo" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Oráculo Harrow · Donel</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="stylesheet" href="/app.css" />
    <script src="/zoom.js" defer></script>
    <script src="/app.js" defer></script>
    <script src="/pedir.js" defer></script>
  </head>
  <body>
    <header class="topo">
      <div class="marca">
        <span class="marca-glifo" aria-hidden="true"></span>
        <div>
          <h1>Oráculo Harrow</h1>
          <p id="contagem" class="contagem" aria-live="polite"></p>
        </div>
      </div>
      <button id="pedir" class="botao-pedir" type="button" aria-haspopup="dialog">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z" /><path d="M8 9.5h8M8 12.5h5" /></svg>
        <span>Pedir</span>
      </button>
      <button id="avisos" class="botao-icone" type="button" aria-label="Avisar neste celular" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 20a2 2 0 0 0 4 0" /></svg>
      </button>
      <button id="atualizar" class="botao-icone" type="button" aria-label="Atualizar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5" /></svg>
      </button>
    </header>
    <main id="baralho" class="baralho" aria-label="Entregas esperando você"></main>
    <div id="aviso" class="aviso" role="status" aria-live="polite" hidden></div>

    <div id="pedir-folha" class="folha-fundo pedir-fundo" hidden>
      <form id="pedir-form" class="folha pedir" role="dialog" aria-modal="true" aria-labelledby="pedir-titulo">
        <div class="pedir-topo">
          <h2 id="pedir-titulo">Pedir ao Líder</h2>
          <button type="button" id="pedir-fechar" class="botao-icone" aria-label="Fechar">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
          </button>
        </div>
        <p class="folha-dica">Vai direto para o chat do Líder. Se ele estiver fechado, o PC guarda e entrega quando ele abrir.</p>
        <textarea id="pedir-texto" rows="6" maxlength="4000" placeholder="O que você quer? Escreva, dite pelo teclado ou grave."></textarea>
        <div class="pedir-linha">
          <button type="button" id="pedir-microfone" class="botao-microfone">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" /><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21" /></svg>
            <span id="pedir-microfone-rotulo">Gravar</span>
          </button>
          <span id="pedir-contador" class="pedir-contador">0 / 4000</span>
        </div>
        <div id="pedir-ouvir" class="pedir-ouvir" hidden>
          <audio id="pedir-audio" controls preload="metadata"></audio>
          <div class="pedir-ouvir-acoes">
            <button type="button" id="pedir-descartar" class="botao botao-neutro">Descartar</button>
            <button type="button" id="pedir-usar" class="botao botao-usar">Usar este áudio</button>
          </div>
        </div>
        <button type="button" id="pedir-anexar" class="pedir-anexar">ou anexe um arquivo de áudio</button>
        <input id="pedir-arquivo" type="file" accept="audio/*" hidden />
        <p id="pedir-voz" class="pedir-voz" role="status" aria-live="polite" hidden></p>
        <button type="submit" id="pedir-enviar" class="botao botao-pedir-enviar" disabled>Enviar ao Líder</button>
        <h3 class="pedir-subtitulo">Seus pedidos</h3>
        <ul id="pedir-lista" class="pedir-lista"></ul>
      </form>
    </div>

    <div id="folha" class="folha-fundo" hidden>
      <form id="folha-form" class="folha" aria-labelledby="folha-titulo">
        <h2 id="folha-titulo">Por que rejeitar?</h2>
        <p class="folha-dica">Escreva ou dite pelo microfone do teclado. Quem entregou recebe este motivo.</p>
        <textarea id="motivo" rows="4" maxlength="2000" required placeholder="O que falta para ficar pronto"></textarea>
        <div class="folha-acoes">
          <button type="button" id="folha-cancelar" class="botao botao-neutro">Cancelar</button>
          <button type="submit" class="botao botao-nao">Rejeitar</button>
        </div>
      </form>
    </div>
  </body>
</html>
