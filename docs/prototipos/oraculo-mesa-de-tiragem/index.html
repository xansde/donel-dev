<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Oráculo · mesa de tiragem</title>
<style>
/* ===================================================================================================
   PROTÓTIPO DESCARTÁVEL (skill /prototipo). Nada aqui vai para produção.
   Tokens copiados literalmente de:
   - Carta (Harrow): src/main/celular/pwa/app.css (origin/staging, 09/11) — :root claro e bloco escuro
   - Moldura do app (PC): design-system/src/tokens.css (origin/staging, 09/11)
   - Forma da carta: forma A escolhida pelo dono em 05/11 (docs/prototipos/carta-oraculo/final.html, ramo de protótipo)
   =================================================================================================== */

/* --- design-system/src/tokens.css --- */
:root {
  --bg-app: #0e1116;
  --bg-panel: #151a21;
  --bg-raised: #1c232c;
  --border: #28303b;
  --text-primary: #d7dde5;
  --text-muted: #828d9c;
  --accent: #4c9cf0;
  --state-waiting: #e8b44c;
  --state-permission: #f0684c;
  --zone-ok: #3dce8f;
  --donel-accent: #e8b44c;
  --font-ui: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --radius-sm: 6px;
  --radius-md: 8px;
}

/* --- src/main/celular/pwa/app.css, bloco escuro (padrão: o PC é dark-only) --- */
.tema-escuro {
  --fundo: #121019;
  --fundo-veio: #17141f;
  --carta: #1d1a27;
  --carta-borda: #4a4030;
  --tinta: #efe6d2;
  --tinta-suave: #b3a78f;
  --ouro: #d2a44c;
  --sim: #5fbf86;
  --nao: #e0736a;
  --pre-fundo: #15131d;
  --sombra: 0 10px 30px rgba(0, 0, 0, 0.5), 0 2px 6px rgba(0, 0, 0, 0.4);
  --martelos: #d98a5f;
  --escudos: #7fa6c9;
  --chaves: #6cbfa8;
  --livros: #cf7d93;
  --estrelas: #a495e0;
  --coroas: #e0bb5a;
  --aviso: #e8b44c;
}
/* --- src/main/celular/pwa/app.css, :root (claro) --- */
.tema-claro {
  --fundo: #e9dfc8;
  --fundo-veio: #e1d4b8;
  --carta: #f8f1e1;
  --carta-borda: #c9b48a;
  --tinta: #2a2118;
  --tinta-suave: #6b5a45;
  --ouro: #9c7428;
  --sim: #2f7a4d;
  --nao: #a8362e;
  --pre-fundo: #efe5cf;
  --sombra: 0 10px 30px rgba(60, 40, 10, 0.18), 0 2px 6px rgba(60, 40, 10, 0.12);
  --martelos: #a4552f;
  --escudos: #3f6687;
  --chaves: #2f7564;
  --livros: #7a2c40;
  --estrelas: #4e3f8f;
  --coroas: #8a6a1c;
  --aviso: #e8b44c;
}
:root {
  --serifa: 'Iowan Old Style', 'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif;
  --sem-serifa: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
}

* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg-app); color: var(--text-primary); font-family: var(--font-ui); }
button { font: inherit; cursor: pointer; color: inherit; }
svg.ic, .ic svg { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
details > summary { cursor: pointer; }

/* ===================================================================================================
   CASCA DO PROTÓTIPO (não faz parte do design avaliado)
   =================================================================================================== */
.casca-barra { position: sticky; top: 0; z-index: 100; background: var(--bg-panel); border-bottom: 1px solid var(--border); padding: 8px 16px; display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; font-size: 12px; }
.casca-barra h1 { margin: 0; font-size: 14px; font-weight: 600; }
.casca-barra h1 small { display: block; font-weight: 400; font-size: 11px; color: var(--text-muted); }
.casca-grupo { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.casca-grupo > span { color: var(--text-muted); margin-right: 2px; }
.casca-grupo button { background: var(--bg-raised); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 5px 10px; font-size: 12px; color: var(--text-primary); }
.casca-grupo button[aria-pressed='true'] { border-color: var(--donel-accent); color: var(--donel-accent); }
.casca-sobre { padding: 10px 16px 0; font-size: 13px; color: var(--text-muted); max-width: 1180px; line-height: 1.45; }
.casca-sobre b { color: var(--text-primary); }
.casca-palco { display: flex; flex-wrap: wrap; gap: 28px; justify-content: center; align-items: flex-start; padding: 16px 16px 80px; }
.casca-rotulo { font-size: 11px; color: var(--text-muted); text-align: center; margin-bottom: 6px; letter-spacing: .08em; text-transform: uppercase; }

/* Moldura do PC: a janela do Donel Dev com o Oráculo no centro */
.pc { width: min(1280px, calc(100vw - 32px)); height: 800px; border-radius: 10px; overflow: hidden; border: 1px solid var(--border); background: var(--bg-app); display: flex; flex-direction: column; box-shadow: 0 20px 50px rgba(0,0,0,.5); }
.pc-titulo { height: 30px; flex: none; background: var(--bg-panel); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; padding: 0 12px; font-size: 12px; color: var(--text-muted); }
.pc-titulo i { width: 10px; height: 10px; border-radius: 50%; background: var(--border); display: inline-block; }
.pc-titulo .troca { margin-left: auto; display: flex; gap: 2px; }
.pc-titulo .troca b, .pc-titulo .troca span { padding: 2px 10px; border-radius: var(--radius-sm); }
.pc-titulo .troca b { color: var(--donel-accent); background: var(--bg-raised); font-weight: 600; }
.pc-tela { flex: 1; min-height: 0; position: relative; }

/* Moldura do celular */
.cel { width: 390px; height: 820px; border-radius: 44px; padding: 12px; background: #000; box-shadow: 0 0 0 2px #333, 0 20px 50px rgba(0,0,0,.5); flex: none; }
.cel-tela { position: relative; width: 100%; height: 100%; border-radius: 34px; overflow: hidden; display: flex; flex-direction: column; }
.cel-status { height: 30px; flex: none; display: flex; justify-content: space-between; align-items: center; padding: 6px 26px 0; font-size: 12px; font-weight: 600; background: var(--fundo); color: var(--tinta); }
.cel-tela .vista { flex: 1; min-height: 0; }

/* A vista: onde cada variante monta a mesa. Container query: a mesma variante se adapta ao celular. */
.vista { position: relative; height: 100%; container-type: inline-size; container-name: vista; overflow: hidden; background: var(--fundo); background-image: radial-gradient(circle at 50% 0%, var(--fundo-veio), var(--fundo) 70%); color: var(--tinta); font-family: var(--sem-serifa); }

/* Aviso de destravado (toast) */
.oc-toast { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%) translateY(20px); opacity: 0; transition: all .35s ease; background: var(--tinta); color: var(--carta); border-radius: 12px; padding: 9px 14px; font-size: .82rem; line-height: 1.35; max-width: min(92%, 520px); z-index: 60; box-shadow: var(--sombra); display: flex; gap: 8px; align-items: flex-start; pointer-events: none; }
.oc-toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
.oc-toast b { color: var(--sim); white-space: nowrap; }
.tema-claro .oc-toast b { color: #8fe0b0; }

/* ===================================================================================================
   A CARTA — molde modular (igual em todas as variantes)
   Cabeça → O que você decide → Visual → Recomendação e porquê → Resposta (cada caminho com o que acontece)
   → Risco → Saídas de sempre. O verso guarda o pedido literal e o detalhe técnico.
   =================================================================================================== */
.naipe-martelos { --naipe: var(--martelos); } .naipe-escudos { --naipe: var(--escudos); } .naipe-chaves { --naipe: var(--chaves); }
.naipe-livros { --naipe: var(--livros); } .naipe-estrelas { --naipe: var(--estrelas); } .naipe-coroas { --naipe: var(--coroas); }

.oc-carta { position: relative; width: 100%; height: 100%; perspective: 1800px; color: var(--tinta); font-family: var(--sem-serifa); font-size: 14px; }
.oc-giro { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .6s ease; }
.oc-carta.virada .oc-giro { transform: rotateY(180deg); }
.oc-face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 18px; background: var(--carta); box-shadow: var(--sombra); padding: 8px; }
.oc-face.verso { transform: rotateY(180deg); }
.oc-moldura { height: 100%; border: 2px solid var(--naipe); border-radius: 12px; padding: 4px; }
.oc-interna { position: relative; height: 100%; border: 1px solid var(--ouro); border-radius: 9px; display: flex; flex-direction: column; overflow: hidden; }
.oc-rolagem { flex: 1; min-height: 0; overflow: auto; padding: 0 14px 10px; scrollbar-width: thin; }

/* Cabeça */
.oc-cabeca { flex: none; display: flex; align-items: center; gap: 8px; padding: 9px 12px 2px; color: var(--naipe); }
.oc-cabeca .glifo { width: 24px; height: 24px; flex: none; }
.oc-cabeca .glifo svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.oc-cabeca .tipo { font-family: var(--serifa); font-size: .7rem; letter-spacing: .2em; text-transform: uppercase; }
.oc-cabeca .idx { margin-left: auto; white-space: nowrap; font-family: var(--serifa); font-size: .75rem; color: var(--tinta-suave); }
.oc-meta { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 10px; font-size: .68rem; letter-spacing: .1em; text-transform: uppercase; color: var(--tinta-suave); padding: 2px 12px 0; }
.oc-meta .urgente { color: var(--nao); font-weight: 700; }
.oc-pergunta { margin: 4px 0 2px; text-align: center; font-family: var(--serifa); font-size: 1.22rem; line-height: 1.2; font-weight: 600; }
.oc-destrava { display: block; font-size: .78rem; color: var(--tinta-suave); text-align: center; margin: 2px 0 8px; line-height: 1.35; }
.oc-destrava b { color: var(--sim); font-weight: 700; white-space: nowrap; }
.oc-real { font-size: .64rem; letter-spacing: .06em; text-transform: uppercase; color: var(--tinta-suave); opacity: .8; text-align: center; margin-top: 2px; }

/* Visual (módulos tipados) */
.oc-vis { border: 1px solid var(--carta-borda); background: var(--pre-fundo); border-radius: 10px; padding: 10px; font-size: .8rem; margin: 2px 0 8px; }
.oc-vis h5 { margin: 0 0 7px; font-size: .64rem; letter-spacing: .12em; text-transform: uppercase; color: var(--tinta-suave); font-weight: 600; display: flex; justify-content: space-between; gap: 8px; }
.oc-vis h5 i { font-style: normal; letter-spacing: .04em; text-transform: none; opacity: .8; }
/* checagens */
.oc-luzes { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; }
.oc-luzes li { display: grid; grid-template-columns: 18px 1fr; gap: 1px 8px; align-items: start; }
.oc-luzes li > i { width: 16px; height: 16px; border-radius: 50%; display: grid; place-items: center; margin-top: 1px; color: #fff; font-style: normal; font-size: 10px; font-weight: 800; }
.oc-luzes li.ok > i { background: var(--sim); }
.oc-luzes li.nao > i { background: var(--nao); }
.oc-luzes li.aviso > i { background: var(--aviso); color: #2a2118; }
.oc-luzes b { font-size: .8rem; }
.oc-luzes span { grid-column: 2; font-size: .72rem; color: var(--tinta-suave); line-height: 1.3; }
/* passos do dono */
.oc-passos { margin: 0; padding: 0; list-style: none; counter-reset: p; display: grid; gap: 6px; }
.oc-passos li { counter-increment: p; display: grid; grid-template-columns: 22px 1fr; gap: 8px; align-items: start; font-size: .8rem; line-height: 1.35; }
.oc-passos li::before { content: counter(p); width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--naipe); color: var(--naipe); display: grid; place-items: center; font-weight: 700; font-size: .72rem; }
.oc-passos li small { display: block; color: var(--tinta-suave); font-size: .72rem; }
.oc-parado { display: flex; align-items: center; gap: 8px; margin-top: 9px; font-size: .74rem; color: var(--tinta-suave); }
.oc-parado .trilho { flex: 1; height: 6px; border-radius: 3px; background: repeating-linear-gradient(45deg, var(--nao), var(--nao) 6px, transparent 6px, transparent 11px); opacity: .75; }
.oc-parado b { color: var(--nao); }
/* grade da semana */
.oc-grade { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.oc-grade .dia { font-size: .64rem; text-transform: uppercase; letter-spacing: .08em; color: var(--tinta-suave); text-align: center; }
.oc-grade .col { display: grid; gap: 3px; align-content: start; }
.oc-grade .bloco { border-radius: 5px; padding: 3px 5px; font-size: .64rem; background: color-mix(in srgb, var(--naipe) 22%, var(--carta)); border-left: 3px solid var(--naipe); line-height: 1.2; }
.oc-grade .bloco.sem { border-left-color: var(--nao); background: color-mix(in srgb, var(--nao) 16%, var(--carta)); }
/* comparação de variantes */
.oc-comp { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.oc-comp .tela { border: 1.5px solid var(--carta-borda); border-radius: 8px; background: #151a21; padding: 6px; min-height: 92px; display: flex; flex-direction: column; gap: 3px; position: relative; }
.oc-comp .tela.rec { border-color: var(--ouro); box-shadow: 0 0 0 1px var(--ouro); }
.oc-comp .tela .l { height: 6px; border-radius: 3px; background: #28303b; }
.oc-comp .tela .l.a { background: #4c9cf0; } .oc-comp .tela .l.o { background: #e8b44c; } .oc-comp .tela .l.v { background: #3dce8f; }
.oc-comp .tela .cols { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; flex: 1; }
.oc-comp .tela .cols div { border-radius: 3px; background: #1c232c; border: 1px solid #28303b; display: flex; flex-direction: column; gap: 2px; padding: 2px; }
.oc-comp .tela .faixa { font-size: 8px; color: #828d9c; letter-spacing: .08em; text-transform: uppercase; }
.oc-comp figcaption { font-size: .72rem; text-align: center; margin-top: 4px; line-height: 1.2; }
.oc-comp figure { margin: 0; }
.oc-comp figure button.ver { width: 100%; background: none; border: 0; padding: 0; text-align: inherit; }
.oc-comp .selo-rec { position: absolute; top: -8px; right: -6px; background: var(--ouro); color: var(--carta); font-size: .55rem; font-weight: 800; letter-spacing: .08em; border-radius: 999px; padding: 1px 6px; text-transform: uppercase; }
/* irreversível × tem volta */
.oc-volta { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.oc-volta div { border-radius: 8px; padding: 8px; font-size: .74rem; line-height: 1.35; }
.oc-volta .nao-volta { border: 1.5px solid var(--nao); }
.oc-volta .volta { border: 1.5px solid var(--sim); }
.oc-volta b { display: block; font-size: .66rem; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 3px; }
.oc-volta .nao-volta b { color: var(--nao); } .oc-volta .volta b { color: var(--sim); }
/* medidor */
.oc-medidor { display: grid; gap: 9px; }
.oc-medidor .linha { display: grid; gap: 3px; }
.oc-medidor .rot { display: flex; justify-content: space-between; font-size: .72rem; color: var(--tinta-suave); gap: 8px; }
.oc-medidor .rot b { color: var(--tinta); }
.oc-medidor .barra { height: 10px; border-radius: 5px; background: var(--carta-borda); overflow: hidden; position: relative; }
.oc-medidor .barra div { height: 100%; border-radius: 5px; background: var(--naipe); }
.oc-medidor .barra div.ruim { background: var(--nao); }
.oc-medidor .barra div.bom { background: var(--sim); }
.oc-medidor .zero { font-family: var(--serifa); font-size: 1.6rem; color: var(--nao); line-height: 1; }
/* citação (quem pediu, nas palavras dele) */
.oc-citacao { border-left: 3px solid var(--naipe); padding: 4px 0 4px 10px; margin: 0 0 6px; font-family: var(--serifa); font-style: italic; font-size: .86rem; line-height: 1.4; }
.oc-citacao small { display: block; font-family: var(--sem-serifa); font-style: normal; font-size: .68rem; color: var(--tinta-suave); margin-top: 3px; }

/* Recomendação */
.oc-rec { margin: 2px 0 8px; padding: 7px 10px; border-top: 1px solid var(--ouro); border-bottom: 1px solid var(--ouro); text-align: center; font-size: .82rem; line-height: 1.38; }
.oc-rec b { color: var(--ouro); font-family: var(--serifa); font-size: .98rem; }

/* Resposta: caminhos (cada um com o que acontece) */
.oc-caminhos { display: flex; flex-direction: column; gap: 7px; }
.oc-caminho { text-align: left; width: 100%; border: 1.5px solid var(--carta-borda); background: var(--carta); border-radius: 12px; padding: 8px 12px; display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: center; transition: transform .12s ease; }
.oc-caminho:hover { transform: translateY(-1px); border-color: var(--naipe); }
.oc-caminho b { font-size: .94rem; }
.oc-caminho span { grid-column: 1 / -1; font-size: .77rem; color: var(--tinta-suave); line-height: 1.35; }
.oc-caminho em { font-style: normal; font-size: .6rem; letter-spacing: .08em; text-transform: uppercase; color: var(--carta); background: var(--ouro); border-radius: 999px; padding: 2px 8px; font-weight: 700; }
.oc-caminho.rec { border-color: var(--ouro); box-shadow: inset 0 0 0 1px var(--ouro); }
.oc-caminho.armado { background: var(--pre-fundo); }
.oc-caminho .confirma { grid-column: 1 / -1; font-size: .72rem; color: var(--ouro); font-weight: 700; }
/* segurar para confirmar (irreversível) */
.oc-segurar { position: relative; overflow: hidden; }
.oc-segurar .enchendo { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: color-mix(in srgb, var(--nao) 25%, transparent); pointer-events: none; }
.oc-segurar.segurando .enchendo { width: 100%; transition: width 1.2s linear; }
/* campo livre e texto a aprovar */
.oc-campo { display: flex; flex-direction: column; gap: 6px; }
.oc-campo label { font-size: .74rem; color: var(--tinta-suave); }
.oc-campo textarea { width: 100%; min-height: 70px; border-radius: 10px; border: 1.5px solid var(--carta-borda); background: var(--pre-fundo); color: var(--tinta); font: .88rem/1.4 var(--sem-serifa); padding: 9px; resize: vertical; }
.oc-campo textarea:focus { outline: none; border-color: var(--ouro); }
.oc-campo .acoes { display: flex; gap: 6px; flex-wrap: wrap; }
.oc-btn { border: 0; border-radius: 10px; padding: 8px 14px; font-weight: 700; font-size: .84rem; background: var(--tinta); color: var(--carta); }
.oc-btn.ouro { background: var(--ouro); color: var(--carta); }
.oc-btn.leve { background: transparent; color: var(--tinta); border: 1.5px solid var(--carta-borda); font-weight: 600; }
.oc-btn:disabled { opacity: .4; cursor: default; }
.oc-msg { border: 1px solid var(--carta-borda); border-radius: 4px 14px 14px 14px; background: var(--pre-fundo); padding: 8px 11px; font-size: .86rem; line-height: 1.42; }
.oc-msg-dest { font-size: .7rem; color: var(--tinta-suave); margin-bottom: 4px; letter-spacing: .02em; }
.oc-msg-dest b { color: var(--tinta); }
/* itens em lote */
.oc-itens { display: grid; gap: 6px; }
.oc-item { border: 1px solid var(--carta-borda); border-radius: 10px; padding: 7px 9px; background: var(--carta); display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: start; }
.oc-item .t { font-weight: 700; font-size: .82rem; }
.oc-item .r { grid-column: 1 / -1; font-size: .74rem; color: var(--tinta-suave); line-height: 1.35; }
.oc-item .r b { color: var(--ouro); font-weight: 600; }
.oc-item .alt { grid-column: 1 / -1; font-size: .7rem; color: var(--tinta-suave); opacity: .85; }
.oc-item .alterna { display: flex; gap: 2px; border: 1px solid var(--carta-borda); border-radius: 999px; padding: 2px; }
.oc-item .alterna button { border: 0; background: transparent; border-radius: 999px; padding: 2px 8px; font-size: .66rem; font-weight: 700; color: var(--tinta-suave); }
.oc-item .alterna button[aria-pressed='true'] { background: var(--sim); color: #fff; }
.oc-item .alterna button.troca[aria-pressed='true'] { background: var(--aviso); color: #2a2118; }
.oc-item .nota { grid-column: 1 / -1; display: none; }
.oc-item.trocando .nota { display: block; }
.oc-item .nota input { width: 100%; border-radius: 8px; border: 1px solid var(--carta-borda); background: var(--pre-fundo); color: var(--tinta); padding: 5px 8px; font-size: .78rem; }
.oc-num { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; margin-top: 3px; }
.oc-num label { display: flex; align-items: center; gap: 4px; font-size: .72rem; color: var(--tinta-suave); border: 1px solid var(--carta-borda); border-radius: 999px; padding: 2px 4px 2px 9px; }
.oc-num button { width: 20px; height: 20px; border-radius: 50%; border: 0; background: var(--pre-fundo); font-weight: 800; line-height: 1; padding: 0; }
.oc-num output { min-width: 14px; text-align: center; font-weight: 800; color: var(--tinta); }

/* Risco */
.oc-risco { display: flex; gap: 8px; align-items: flex-start; margin-top: 9px; font-size: .76rem; color: var(--tinta-suave); line-height: 1.35; }
.oc-risco i { flex: none; font-style: normal; font-size: .6rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; border: 1.5px solid currentColor; border-radius: 999px; padding: 1px 6px; transform: rotate(-4deg); }
.oc-risco.alto i { color: var(--nao); } .oc-risco.baixo i { color: var(--sim); }

/* Saídas de sempre */
.oc-saidas { flex: none; display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; justify-content: space-between; padding: 6px 12px 9px; border-top: 1px solid var(--carta-borda); }
.oc-saidas .grupo { display: flex; flex-wrap: wrap; gap: 4px; }
.oc-saidas button { border: 1px solid var(--carta-borda); background: transparent; border-radius: 999px; padding: 3px 9px; font-size: .7rem; color: var(--tinta-suave); }
.oc-saidas button:hover { color: var(--tinta); border-color: var(--naipe); }
.oc-saidas .virar { border-color: var(--naipe); color: var(--naipe); }
.oc-saidas-painel { display: none; padding: 8px 12px; border-top: 1px dashed var(--carta-borda); font-size: .78rem; }
.oc-saidas-painel.on { display: block; }
.oc-saidas-painel textarea { width: 100%; min-height: 50px; border-radius: 8px; border: 1px solid var(--carta-borda); background: var(--pre-fundo); color: var(--tinta); padding: 6px 8px; font: .82rem var(--sem-serifa); }
.oc-saidas-painel .chips { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 4px; }
.oc-saidas-painel .chips button { border: 1px solid var(--carta-borda); background: var(--carta); border-radius: 999px; padding: 3px 9px; font-size: .74rem; }
.oc-esperando { margin-top: 8px; font-size: .76rem; border-left: 3px solid var(--aviso); padding: 5px 9px; background: var(--pre-fundo); border-radius: 6px; }

/* Verso */
.oc-verso-corpo { flex: 1; min-height: 0; overflow: auto; padding: 4px 16px 10px; font-size: .84rem; line-height: 1.45; }
.oc-verso-corpo h4 { margin: 12px 0 3px; font-family: var(--serifa); font-size: .7rem; letter-spacing: .16em; text-transform: uppercase; color: var(--naipe); }
.oc-verso-corpo p { margin: 0; }
.oc-verso-corpo blockquote { margin: 0; padding: 4px 0 4px 10px; border-left: 3px solid var(--naipe); font-family: var(--serifa); font-style: italic; }
.oc-verso-corpo dl { margin: 0; } .oc-verso-corpo dt { font-weight: 700; margin-top: 6px; } .oc-verso-corpo dd { margin: 0; color: var(--tinta-suave); }
.oc-verso-corpo details { margin-top: 10px; border-top: 1px solid var(--carta-borda); padding-top: 6px; }
.oc-verso-corpo details summary { font-size: .74rem; color: var(--tinta-suave); }
.oc-verso-corpo .tec { font-family: var(--mono); font-size: .7rem; background: var(--pre-fundo); border: 1px solid var(--carta-borda); border-radius: 6px; padding: 8px; white-space: pre-wrap; color: var(--tinta); margin-top: 6px; }

/* Carta em miniatura (o dorso e a carta fechada na mesa) */
.oc-mini { position: relative; border-radius: 12px; background: var(--carta); border: 2px solid var(--naipe); color: var(--tinta); padding: 9px 10px; text-align: left; box-shadow: var(--sombra); display: flex; flex-direction: column; gap: 3px; width: 100%; }
.oc-mini .topo { display: flex; align-items: center; gap: 6px; color: var(--naipe); }
.oc-mini .topo .glifo { width: 16px; height: 16px; }
.oc-mini .topo .glifo svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.7; }
.oc-mini .topo small { font-size: .58rem; letter-spacing: .14em; text-transform: uppercase; }
.oc-mini .topo .urg { margin-left: auto; color: var(--nao); font-size: .58rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
.oc-mini b { font-family: var(--serifa); font-size: .86rem; line-height: 1.2; }
.oc-mini .dest { font-size: .68rem; color: var(--tinta-suave); line-height: 1.25; }
.oc-mini .dest em { color: var(--sim); font-style: normal; font-weight: 700; }
.oc-dorso { border-radius: 12px; border: 2px solid var(--ouro); background: var(--carta); box-shadow: var(--sombra); display: grid; place-items: center; color: var(--ouro); }
.oc-dorso svg { width: 46%; max-width: 70px; fill: none; stroke: currentColor; stroke-width: 1.2; opacity: .7; }

/* Carta saindo da mesa */
.oc-sai-direita { animation: oc-sai-d .45s ease forwards; }
.oc-sai-esquerda { animation: oc-sai-e .45s ease forwards; }
.oc-sai-cima { animation: oc-sai-c .45s ease forwards; }
@keyframes oc-sai-d { to { transform: translateX(120%) rotate(12deg); opacity: 0; } }
@keyframes oc-sai-e { to { transform: translateX(-120%) rotate(-12deg); opacity: 0; } }
@keyframes oc-sai-c { to { transform: translateY(-110%) scale(.9); opacity: 0; } }

/* Mesa vazia */
.oc-vazia { height: 100%; display: grid; place-items: center; text-align: center; padding: 24px; color: var(--tinta-suave); }
.oc-vazia b { display: block; font-family: var(--serifa); font-size: 1.3rem; color: var(--tinta); margin: 10px 0 4px; }
.oc-vazia .oc-dorso { width: 120px; height: 170px; margin: 0 auto; }

/* Celular de verdade (tela estreita): a moldura some e a vista ocupa a tela inteira */
body.no-celular .casca-palco { padding: 0; gap: 0; }
body.no-celular .casca-rotulo, body.no-celular .casca-sobre { display: none; }
body.no-celular .cel { width: 100vw; height: calc(100dvh - 44px); border-radius: 0; padding: 0; box-shadow: none; }
body.no-celular .cel-tela { border-radius: 0; }
body.no-celular .cel-status { display: none; }
body.no-celular .casca-barra { padding: 6px 10px; gap: 6px; }
body.no-celular .casca-barra h1, body.no-celular .casca-barra [data-grupo-tela] { display: none; }

/* ===================================================================================================
   Variante A — Tiragem em três casas
   =================================================================================================== */
.vA-mesa { position: absolute; inset: 0; display: grid; grid-template-columns: minmax(0, 1fr) 250px; grid-template-rows: auto minmax(0, 1fr) auto; gap: 12px 18px; padding: 14px 18px 12px; }

/* ---- faixa das três casas ---- */
.vA-faixa { grid-column: 1; grid-row: 1; display: grid; grid-template-columns: 128px repeat(3, minmax(0, 1fr)); gap: 10px; }
.vA-lead { display: flex; flex-direction: column; justify-content: center; gap: 2px; padding-right: 4px; }
.vA-titulo { font-family: var(--serifa); font-size: .7rem; letter-spacing: .22em; text-transform: uppercase; color: var(--ouro); }
.vA-conta { font-family: var(--serifa); font-size: .95rem; line-height: 1.2; color: var(--tinta); }
.vA-conta b { display: block; font-size: 1.9rem; line-height: 1; font-weight: 600; }
.vA-sub { font-size: .7rem; color: var(--tinta-suave); }

.vA-casa { position: relative; display: grid; grid-template-columns: 56px minmax(0, 1fr); grid-template-rows: auto 1fr auto; grid-template-areas: 'pilha nome' 'pilha topo' 'pilha estado'; gap: 2px 12px; align-items: start; text-align: left; padding: 10px 12px 9px 10px; border: 1px solid var(--carta-borda); border-radius: 14px; background: color-mix(in srgb, var(--carta) 55%, transparent); color: var(--tinta); transition: transform .15s ease, border-color .15s ease, background .15s ease; min-width: 0; }
.vA-casa:not(:disabled):hover { transform: translateY(-2px); border-color: var(--ouro); background: color-mix(in srgb, var(--carta) 85%, transparent); }
.vA-casa:disabled { cursor: default; }
.vA-casa.vA-ativa { border-color: var(--ouro); box-shadow: inset 0 0 0 1px var(--ouro); }
.vA-casa.vA-vazia { border-style: dashed; background: transparent; }
.vA-casa-nome { grid-area: nome; font-family: var(--serifa); font-size: .68rem; letter-spacing: .18em; text-transform: uppercase; font-weight: 700; }
.vA-casa-trava .vA-casa-nome { color: var(--nao); }
.vA-casa-hoje .vA-casa-nome { color: var(--ouro); }
.vA-casa-espera .vA-casa-nome { color: var(--tinta-suave); }
.vA-casa-dest .vA-casa-nome { color: var(--sim); }
.vA-casa-topo { grid-area: topo; display: flex; gap: 6px; align-items: flex-start; min-width: 0; }
.vA-glifo { flex: none; width: 15px; height: 15px; color: var(--naipe); display: inline-block; }
.vA-glifo svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.vA-casa-perg { font-family: var(--serifa); font-size: .8rem; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.vA-casa-estado { grid-area: estado; font-size: .66rem; color: var(--tinta-suave); }
.vA-casa.vA-ativa .vA-casa-estado { color: var(--ouro); }

/* pilha de dorsos */
.vA-pilha { grid-area: pilha; position: relative; width: 50px; height: 72px; margin-top: 2px; }
.vA-pilha.vazia { border: 1.5px dashed var(--carta-borda); border-radius: 8px; }
.vA-dorso { position: absolute; inset: 0; border-radius: 8px; border: 1.5px solid var(--ouro); background: var(--carta); display: grid; place-items: center; color: var(--ouro); box-shadow: 0 2px 5px rgba(0, 0, 0, .35); transform: translate(calc(var(--k) * 3px), calc(var(--k) * -3px)); }
.vA-dorso svg { width: 62%; fill: none; stroke: currentColor; stroke-width: 1.4; opacity: .7; }
.vA-n { position: absolute; right: -8px; bottom: -6px; z-index: 2; min-width: 22px; height: 22px; padding: 0 5px; border-radius: 999px; background: var(--ouro); color: var(--carta); font-size: .74rem; font-weight: 800; display: grid; place-items: center; box-shadow: 0 1px 3px rgba(0, 0, 0, .4); }
.vA-casa-dest { display: none; }
.vA-pilha-dest { border: 1.5px solid var(--sim); border-radius: 8px; display: grid; place-items: center; color: var(--sim); background: color-mix(in srgb, var(--sim) 12%, transparent); }
.vA-pilha-dest i { font-style: normal; font-weight: 800; }
.vA-pilha-dest .vA-n { background: var(--sim); }

/* ---- centro: a carta da vez ---- */
.vA-centro { grid-column: 1; grid-row: 2; position: relative; min-height: 0; display: flex; justify-content: center; }
.vA-carta { position: relative; z-index: 5; height: 100%; width: min(720px, 100%); touch-action: pan-y; cursor: grab; }
.vA-carta .oc-rolagem, .vA-carta .oc-verso-corpo { touch-action: pan-y; }
.vA-arrastando .vA-carta { cursor: grabbing; }
.vA-arrastando, .vA-arrastando * { user-select: none; -webkit-user-select: none; }
.vA-carta.vA-voando { z-index: 50; pointer-events: none; }
.vA-carimbo { position: absolute; top: 74px; z-index: 6; pointer-events: none; opacity: 0; font-family: var(--serifa); font-size: 1.5rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; padding: 4px 14px; border: 3px solid currentColor; border-radius: 10px; background: color-mix(in srgb, var(--carta) 80%, transparent); }
.vA-carimbo.sim { left: 26px; color: var(--sim); transform: rotate(-12deg); }
.vA-carimbo.nao { right: 26px; color: var(--nao); transform: rotate(10deg); }
.vA-vazia { width: 100%; }

/* ---- pé da mesa ---- */
.vA-pe { grid-column: 1; grid-row: 3; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 14px; }
.vA-dica { font-size: .78rem; color: var(--tinta-suave); }
.vA-dica b { color: var(--sim); }
.vA-cel { display: none; }
.vA-teclas { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 4px 10px; font-size: .68rem; color: var(--tinta-suave); }
.vA-teclas kbd { font: 600 .64rem var(--sem-serifa); border: 1px solid var(--carta-borda); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; margin-right: 2px; color: var(--tinta); }
.vA-seguir { position: relative; overflow: hidden; display: flex; align-items: center; gap: 12px; max-width: 460px; min-width: 260px; border: 0; border-radius: 999px; padding: 8px 18px 8px 22px; background: var(--ouro); color: var(--carta); text-align: left; box-shadow: var(--sombra); transition: transform .12s ease, filter .12s ease; }
.vA-seguir:hover { transform: translateY(-1px); filter: brightness(1.06); }
.vA-seguir-txt { position: relative; flex: 1; min-width: 0; display: flex; flex-direction: column; }
.vA-seguir small { font-size: .6rem; letter-spacing: .14em; text-transform: uppercase; font-weight: 700; opacity: .8; }
.vA-seguir b { font-family: var(--serifa); font-size: .98rem; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vA-seta { position: relative; font-size: 1.2rem; font-weight: 800; }
.vA-enche { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: rgba(0, 0, 0, .22); pointer-events: none; }
.vA-seguir.vA-falta { background: color-mix(in srgb, var(--ouro) 60%, var(--carta)); }
.vA-seguir.vA-segurar { background: color-mix(in srgb, var(--nao) 55%, var(--ouro)); }
.vA-seguir.vA-segurando .vA-enche { width: 100%; transition: width 1.2s linear; }
.vA-seguir.vA-pulsa { animation: vA-pulsa .5s ease 2; }
@keyframes vA-pulsa { 50% { transform: scale(1.05); } }
.vA-pe-fim .vA-seguir, .vA-pe-fim .vA-teclas { visibility: hidden; }

/* ---- casa Destravado ---- */
.vA-destravado { grid-column: 2; grid-row: 1 / 4; display: flex; flex-direction: column; gap: 10px; min-height: 0; padding: 14px 12px 12px; border: 1.5px dashed color-mix(in srgb, var(--sim) 45%, transparent); border-radius: 16px; background: color-mix(in srgb, var(--carta) 30%, transparent); transition: background .2s ease, border-color .2s ease; }
.vA-arrastando .vA-destravado { border-color: var(--sim); }
.vA-destravado.vA-alvo { border-style: solid; background: color-mix(in srgb, var(--sim) 14%, transparent); }
.vA-dest-cab h3 { margin: 0; display: flex; align-items: center; gap: 8px; font-family: var(--serifa); font-size: 1.05rem; font-weight: 600; color: var(--sim); }
.vA-dest-cab h3 b { font-family: var(--sem-serifa); font-size: .72rem; min-width: 22px; height: 22px; border-radius: 999px; background: var(--sim); color: var(--carta); display: grid; place-items: center; padding: 0 6px; }
.vA-dest-cab p { margin: 2px 0 0; font-size: .72rem; color: var(--tinta-suave); }
.vA-dest-fechar { display: none; }
.vA-slot { flex: none; min-height: 84px; display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1.5px dashed var(--carta-borda); border-radius: 12px; font-size: .74rem; line-height: 1.35; color: var(--tinta-suave); transition: all .2s ease; }
.vA-slot b { color: var(--tinta); font-weight: 600; }
.vA-slot-seta { font-size: 1.3rem; color: var(--sim); }
.vA-arrastando .vA-slot, .vA-alvo .vA-slot { border-color: var(--sim); color: var(--tinta); }
.vA-alvo .vA-slot { background: color-mix(in srgb, var(--sim) 18%, transparent); transform: scale(1.03); }
.vA-slot.vA-recebe { background: color-mix(in srgb, var(--sim) 28%, transparent); }
.vA-slot.vA-slot-fim { display: none; }
.vA-rastro { list-style: none; margin: 0; padding: 0 2px 4px; flex: 0 1 auto; min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 7px; scrollbar-width: thin; }
.vA-slip { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 8px 10px; border-radius: 10px; background: var(--carta); border: 1px solid var(--carta-borda); border-left: 3px solid var(--naipe); box-shadow: 0 2px 6px rgba(0, 0, 0, .3); font-family: var(--serifa); font-size: .86rem; line-height: 1.25; transform: rotate(-.6deg); }
.vA-slip:nth-child(even) { transform: rotate(.5deg); }
.vA-slip i { font-style: normal; color: var(--sim); font-weight: 800; font-family: var(--sem-serifa); }
.vA-slip.vA-cai { animation: vA-cai .45s cubic-bezier(.2,.9,.3,1.3); }
@keyframes vA-cai { from { transform: translateY(-18px) rotate(-4deg) scale(.9); opacity: 0; } }
.vA-adiadas { flex: none; font-size: .68rem; line-height: 1.4; color: var(--tinta-suave); }
.vA-adiadas:empty { display: none; }
.vA-adiadas b { color: var(--tinta); font-weight: 600; }
.vA-adiadas i { font-style: normal; opacity: .8; }

/* aviso quando o gesto não basta */
.vA-aviso { position: absolute; left: 50%; bottom: 132px; z-index: 70; transform: translateX(-50%) translateY(10px); opacity: 0; pointer-events: none; transition: all .3s ease; max-width: min(90%, 460px); padding: 9px 14px; border-radius: 12px; border: 1.5px solid var(--aviso); background: var(--carta); color: var(--tinta); font-size: .8rem; line-height: 1.35; box-shadow: var(--sombra); }
.vA-aviso.on { opacity: 1; transform: translateX(-50%) translateY(0); }
.vista .vA-mesa ~ .oc-toast { bottom: 76px; width: max-content; }
/* no PC o aviso de destravado aparece dentro da casa Destravado, onde a carta caiu, sem cobrir a carta da vez */
@container vista (min-width: 641px) {
  .vista .vA-mesa ~ .oc-toast { left: auto; right: 30px; bottom: 28px; width: 226px; max-width: 226px; flex-direction: column; gap: 2px; transform: translateY(20px); }
  .vista .vA-mesa ~ .oc-toast.on { transform: none; }
}

/* ===================================================================================================
   Celular: faixa de quatro pilhas pequenas no alto, a carta ocupa o resto
   =================================================================================================== */
@container vista (max-width: 640px) {
  .vA-mesa { grid-template-columns: minmax(0, 1fr); gap: 8px; padding: 8px 10px 10px; }
  .vA-faixa { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
  .vA-lead { display: none; }
  .vA-casa, .vA-casa-dest { display: grid; grid-template-columns: 24px minmax(0, 1fr); grid-template-rows: auto auto; grid-template-areas: 'pilha topo' 'nome nome'; gap: 4px 6px; align-items: center; padding: 6px 6px 5px; border-radius: 10px; }
  .vA-casa:not(:disabled):hover { transform: none; }
  .vA-casa-nome { font-size: .5rem; letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .vA-casa-perg, .vA-casa-estado { display: none; }
  .vA-casa-topo { justify-content: flex-end; padding-right: 2px; }
  .vA-glifo { width: 16px; height: 16px; }
  .vA-pilha { width: 22px; height: 30px; margin: 0; }
  .vA-dorso { border-radius: 4px; border-width: 1px; transform: translate(calc(var(--k) * 2px), calc(var(--k) * -2px)); }
  .vA-pilha.vazia, .vA-pilha-dest { border-radius: 4px; }
  .vA-n { min-width: 17px; height: 17px; font-size: .62rem; right: -12px; bottom: -4px; padding: 0 3px; }
  .vA-casa-dest .vA-casa-topo { display: none; }

  .vA-carta { width: 100%; }
  .vA-carimbo { top: 64px; font-size: 1.2rem; }

  .vA-pe { grid-template-columns: minmax(0, 1fr); gap: 6px; justify-items: stretch; }
  .vA-dica { text-align: center; font-size: .7rem; }
  .vA-pc, .vA-teclas { display: none; }
  .vA-cel { display: inline; }
  .vA-dica .vA-cel b { color: var(--tinta); }
  .vA-seguir { min-width: 0; max-width: none; width: 100%; padding: 7px 16px 7px 18px; }
  .vA-pe-fim .vA-seguir { display: none; }

  .vA-destravado { display: none; }
  .vA-rastro-aberto .vA-destravado { display: flex; position: absolute; grid-column: 1 / -1; grid-row: 1 / -1; inset: 58px 0 0; z-index: 40; background: var(--fundo); border-style: solid; box-shadow: var(--sombra); }
  .vA-rastro-aberto .vA-dest-fechar { display: block; align-self: flex-start; border: 1px solid var(--carta-borda); background: transparent; border-radius: 999px; padding: 4px 12px; font-size: .74rem; color: var(--tinta); }
  .vA-rastro-aberto .vA-slot { display: none; }
  .vista .vA-mesa ~ .oc-toast { bottom: 92px; }
  .vA-aviso { bottom: 150px; }
}

/* ===================================================================================================
   Variante B — uma carta por vez. A mesa é só a pilha: carta da vez ao centro, dorsos atrás.
   PC: dicas do gesto nas laterais. Celular (@container vista ≤ 640px): carta em tela cheia, dicas embaixo.
   =================================================================================================== */
.vB-mesa { position: absolute; inset: 0; display: grid; grid-template-columns: 1fr minmax(0, 560px) 1fr; grid-template-rows: 1fr auto; grid-template-areas: 'esq pilha dir' '. espaco .'; column-gap: 36px; padding: 20px 28px 10px; }

/* A pilha: dorsos atrás, a carta da vez por cima */
.vB-pilha { grid-area: pilha; position: relative; min-height: 0; margin-bottom: 22px; }
.vB-dorso { position: absolute; inset: 0; border-radius: 18px; transform-origin: 50% 100%; }
.vB-dorso svg { max-width: 120px; }
.vB-pilha { --vB-sobe: 0; }
.vB-d1 { transform: translateY(calc(7px * (1 - var(--vB-sobe)))) scale(calc(.975 + .025 * var(--vB-sobe))) rotate(calc(.6deg * (1 - var(--vB-sobe)))); }
.vB-d2 { transform: translateY(14px) scale(.95) rotate(-.8deg); opacity: .85; }
.vB-d3 { transform: translateY(21px) scale(.925) rotate(1deg); opacity: .7; }
.vB-atual { position: absolute; inset: 0; z-index: 2; touch-action: pan-y; user-select: none; -webkit-user-select: none; cursor: grab; will-change: transform; }
/* No dedo, a rolagem da carta é um contêiner próprio: sem pan-y nela o navegador cancela o arrasto horizontal. */
.vB-atual .oc-rolagem, .vB-atual .oc-verso-corpo { touch-action: pan-y; }
.vB-atual textarea, .vB-atual input, .vB-atual .oc-verso-corpo { user-select: text; -webkit-user-select: text; cursor: auto; }
.vB-atual button { cursor: pointer; }
.vB-atual.vB-arrastando { cursor: grabbing; }
.vB-atual.vB-entra { animation: vB-sobe .34s ease-out; }
@keyframes vB-sobe { from { transform: translateY(16px) scale(.975); opacity: .4; } to { transform: none; opacity: 1; } }
.vB-atual.vB-treme { animation: vB-treme .42s ease; }
@keyframes vB-treme { 20% { transform: translateX(10px); } 45% { transform: translateX(-8px); } 70% { transform: translateX(5px); } 100% { transform: none; } }

/* Carimbo que acende enquanto arrasta */
.vB-carimbo { position: absolute; top: 15%; z-index: 6; pointer-events: none; opacity: 0; max-width: 74%; text-align: center; padding: 7px 16px 8px; border: 3px solid currentColor; border-radius: 10px; font-family: var(--serifa); font-weight: 700; font-size: 1.45rem; line-height: 1.1; letter-spacing: .14em; text-transform: uppercase; background: color-mix(in srgb, var(--carta) 86%, transparent); box-shadow: 0 6px 18px rgba(0, 0, 0, .25); transition: opacity .12s ease, transform .15s ease; }
.vB-carimbo small { display: block; margin-top: 3px; font-family: var(--sem-serifa); font-size: .82rem; font-weight: 700; letter-spacing: .02em; text-transform: none; }
.vB-carimbo.dir { left: 9%; color: var(--sim); transform: rotate(-11deg) scale(.92); }
.vB-carimbo.esq { right: 9%; color: var(--tinta-suave); transform: rotate(10deg) scale(.92); }
.vB-carimbo.dir.aviso { color: var(--aviso); }
.vB-carimbo.dir.nao { color: var(--nao); }
.vB-carimbo.pronto.dir { transform: rotate(-11deg) scale(1); }
.vB-carimbo.pronto.esq { transform: rotate(10deg) scale(1); }

/* Onde o dono precisa agir quando arrastar não basta */
.vB-aponta { animation: vB-aponta .8s ease 2; }
@keyframes vB-aponta { 50% { box-shadow: 0 0 0 4px var(--ouro); } }

/* Dicas do gesto (PC: nas laterais) */
.vB-dica { align-self: center; display: flex; align-items: center; gap: 12px; max-width: 230px; background: none; border: 1px dashed transparent; border-radius: 14px; padding: 12px 14px; color: var(--tinta-suave); opacity: .62; text-align: left; transition: opacity .15s ease, color .15s ease, border-color .15s ease; }
.vB-dica:hover { opacity: 1; border-color: var(--carta-borda); }
.vB-dica.esq { grid-area: esq; justify-self: end; flex-direction: row; text-align: right; }
.vB-dica.esq .txt { order: 2; } .vB-dica.esq .seta { order: 1; } .vB-dica.esq kbd { order: 3; }
.vB-dica.dir { grid-area: dir; justify-self: start; }
.vB-dica.dir .txt { order: 2; } .vB-dica.dir .seta { order: 3; } .vB-dica.dir kbd { order: 1; }
.vB-dica .seta { font-size: 1.9rem; line-height: 1; font-family: var(--serifa); }
.vB-dica .txt { display: flex; flex-direction: column; gap: 3px; }
.vB-dica .txt b { font-family: var(--serifa); font-size: 1.02rem; color: var(--tinta); font-weight: 600; }
.vB-dica .txt small { font-size: .78rem; line-height: 1.3; }
.vB-dica.dir .txt small.rec { color: var(--ouro); }
.vB-dica.acesa { opacity: 1; }
.vB-dica.dir.acesa { color: var(--sim); border-color: var(--sim); }
.vB-dica.esq.acesa { border-color: var(--tinta-suave); }
.vB-mesa kbd { font-family: var(--sem-serifa); font-size: .66rem; border: 1px solid var(--carta-borda); border-bottom-width: 2px; border-radius: 5px; padding: 1px 6px; color: var(--tinta-suave); background: var(--carta); }
.vB-espaco { grid-area: espaco; justify-self: center; font-size: .72rem; color: var(--tinta-suave); opacity: .62; }

/* O aviso de destravado: largura do texto (a base o limita à metade da vista). No PC ele aparece
   na lateral para onde a carta foi, sem cobrir a próxima; no celular, embaixo, por cima das dicas
   (não cobre as saídas da carta). */
.vB-mesa ~ .oc-toast { width: max-content; max-width: max(200px, calc(50% - 320px)); bottom: 28px; }
.vB-mesa.vB-saiu-dir ~ .oc-toast { left: auto; right: 28px; transform: translateY(20px); }
.vB-mesa.vB-saiu-esq ~ .oc-toast { left: 28px; transform: translateY(20px); }
.vB-mesa.vB-saiu-dir ~ .oc-toast.on, .vB-mesa.vB-saiu-esq ~ .oc-toast.on { transform: none; }

/* Fim: o baralho vazio */
.vB-mesa.vB-fim .vB-dica, .vB-mesa.vB-fim .vB-espaco { visibility: hidden; }
.vB-vazia .oc-dorso { margin-bottom: 4px; }
.vB-vazia b { font-size: 1.5rem; }

/* ---------------------------------------------------------------- celular: carta em tela cheia */
@container vista (max-width: 640px) {
  .vB-mesa { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr auto; grid-template-areas: 'pilha pilha' 'esq dir'; column-gap: 8px; padding: 8px 10px 6px; }
  .vB-pilha { margin-bottom: 26px; }
  .vB-d1 { transform: translateY(calc(8px * (1 - var(--vB-sobe)))) scale(calc(.965 + .035 * var(--vB-sobe))) rotate(calc(.6deg * (1 - var(--vB-sobe)))); }
  .vB-d2 { transform: translateY(15px) scale(.93) rotate(-.8deg); }
  .vB-d3 { transform: translateY(22px) scale(.895) rotate(1deg); }
  .vB-espaco { display: none; }
  .vB-dica { max-width: none; padding: 4px 6px; gap: 6px; border: 0; opacity: .7; }
  .vB-dica .seta { font-size: 1.1rem; }
  .vB-dica .txt b { font-size: .8rem; font-family: var(--sem-serifa); font-weight: 600; color: var(--tinta-suave); }
  .vB-dica .txt small, .vB-dica kbd { display: none; }
  .vB-dica.esq { justify-self: start; }
  .vB-dica.dir { justify-self: end; }
  .vB-dica .txt b { white-space: nowrap; }
  .vB-dica.dir.acesa .txt b { color: var(--sim); }
  .vB-carimbo { font-size: 1.1rem; padding: 6px 12px; }
  .vB-mesa ~ .oc-toast, .vB-mesa.vB-saiu-dir ~ .oc-toast, .vB-mesa.vB-saiu-esq ~ .oc-toast { left: 50%; right: auto; bottom: 4px; max-width: min(92%, 520px); transform: translateX(-50%) translateY(20px); }
  .vB-mesa.vB-saiu-dir ~ .oc-toast.on, .vB-mesa.vB-saiu-esq ~ .oc-toast.on { transform: translateX(-50%); }
  .vB-carimbo small { font-size: .74rem; }
}
/* Celular estreito (moldura de ~366 px): as saídas da carta cabem numa linha só */
@container vista (max-width: 380px) {
  .vB-atual .oc-saidas button { padding: 3px 7px; }
}

/* ===== Variante C — Mão e mesa ===== */
.vC-raiz { position: absolute; inset: 0; display: flex; flex-direction: column; user-select: none; -webkit-user-select: none; }
.vC-raiz textarea, .vC-raiz input { user-select: text; -webkit-user-select: text; }

/* ---- a mesa (feltro) ---- */
.vC-mesa {
  position: relative; flex: 1; min-height: 0; margin: 8px 12px 0; border-radius: 22px;
  display: grid; grid-template-columns: 1fr minmax(420px, 540px) 1fr; grid-template-rows: minmax(0, 1fr); align-items: center; gap: 0 18px; padding: 10px 18px;
  background:
    repeating-linear-gradient(115deg, rgba(255, 255, 255, .012) 0 2px, transparent 2px 7px),
    radial-gradient(ellipse at 50% 42%, var(--fundo-veio), var(--fundo) 78%);
  border: 1px solid var(--carta-borda);
  box-shadow: inset 0 0 90px rgba(0, 0, 0, .45), inset 0 0 0 6px rgba(0, 0, 0, .12);
}
.tema-claro .vC-mesa { box-shadow: inset 0 0 70px rgba(0, 0, 0, .12), inset 0 0 0 6px rgba(0, 0, 0, .04); }
.vC-topo { position: absolute; top: 16px; left: 22px; display: flex; flex-direction: column; gap: 2px; z-index: 2; }
.vC-topo-n { font-family: var(--serifa); font-size: 1.05rem; color: var(--tinta); }
.vC-topo-n b { color: var(--ouro); font-size: 1.5rem; margin-right: 2px; }
.vC-topo-x { font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; color: var(--tinta-suave); }

.vC-centro { position: relative; grid-column: 2; grid-row: 1; height: 100%; min-height: 0; }
.vC-jogada { position: absolute; inset: 0; z-index: 5; touch-action: pan-y; }
.vC-jogada.vC-arrastando { z-index: 40; transition: none; cursor: grabbing; }
.vC-jogada.vC-arrastando .oc-face { box-shadow: 0 30px 60px rgba(0, 0, 0, .55); }
.vC-jogada .oc-cabeca { cursor: grab; touch-action: none; }
.vC-jogada.vC-voando { transition: transform .45s cubic-bezier(.5, 0, .7, .4), opacity .45s ease; z-index: 40; pointer-events: none; }
.vC-jogada.vC-volta-lugar { transition: transform .3s cubic-bezier(.2, .9, .3, 1.2); }
.vC-entra { animation: vC-entra .42s cubic-bezier(.2, .8, .3, 1); }
@keyframes vC-entra { from { transform: translateY(42%) scale(.55) rotate(-3deg); opacity: 0; } }
.vC-treme { animation: vC-treme .42s ease; }
@keyframes vC-treme { 20% { transform: translateX(-9px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(3px); } }

/* lugar vazio no centro / mesa limpa */
.vC-alvo { position: absolute; inset: 0; border-radius: 18px; display: none; }
.vC-sem-carta .vC-alvo { display: grid; }
.vC-alvo-jogue { place-items: center; align-content: center; gap: 6px; text-align: center; padding: 24px; border: 2px dashed var(--carta-borda); color: var(--tinta-suave); }
.vC-alvo-jogue b { font-family: var(--serifa); font-size: 1.25rem; color: var(--tinta); font-weight: 600; }
.vC-alvo-jogue span { font-size: .84rem; max-width: 30ch; line-height: 1.4; }
.vC-alvo-ic { font-size: 1.6rem; color: var(--ouro); }
.vC-centro.vC-quente .vC-alvo, .vC-centro.vC-quente .vC-jogada .oc-face { outline: 2px solid var(--ouro); outline-offset: 4px; }
.vC-centro.vC-quente .vC-alvo-jogue { border-color: var(--ouro); background: color-mix(in srgb, var(--ouro) 10%, transparent); }
.vC-jogando .vC-sem-carta .vC-alvo-jogue { border-color: var(--ouro); }

/* ---- os dois lugares marcados na mesa ---- */
.vC-lugar {
  justify-self: center; width: min(220px, 100%); aspect-ratio: 5 / 7; max-height: 100%; border-radius: 18px;
  background: transparent; border: 2px dashed var(--tinta-suave); color: var(--tinta-suave);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 18px 16px; text-align: center;
  transition: transform .18s ease, background .18s ease, border-color .18s ease, opacity .18s ease; opacity: .8;
}
.vC-lugar:hover { opacity: 1; }
.vC-lugar-tarde { grid-column: 1; grid-row: 1; justify-self: end; }
.vC-lugar-seguir { grid-column: 3; grid-row: 1; justify-self: start; border-color: var(--ouro); color: var(--ouro); opacity: 1; background: color-mix(in srgb, var(--ouro) 6%, transparent); }
.vC-lugar-ic { width: 54px; height: 54px; border-radius: 50%; border: 2px dashed currentColor; display: grid; place-items: center; font-size: 1.4rem; margin-bottom: 4px; }
.vC-lugar b { font-family: var(--serifa); font-size: 1.12rem; line-height: 1.2; color: var(--tinta); font-weight: 600; }
.vC-lugar-seguir b { color: var(--ouro); }
.vC-lugar small { font-size: .76rem; line-height: 1.35; color: var(--tinta-suave); }
.vC-lugar-seguir small { font-family: var(--serifa); font-size: .92rem; color: var(--tinta); }
.vC-lugar-dica { margin-top: 8px; font-size: .66rem; letter-spacing: .08em; text-transform: uppercase; color: var(--tinta-suave); display: flex; gap: 6px; align-items: center; justify-content: center; flex-wrap: wrap; }
.vC-raiz kbd { font: 600 .66rem var(--sem-serifa); border: 1px solid var(--carta-borda); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; color: var(--tinta-suave); letter-spacing: 0; }
.vC-lugar.vC-quente { transform: scale(1.06); opacity: 1; border-style: solid; background: color-mix(in srgb, currentColor 16%, transparent); }
.vC-lugar-seguir.vC-quente .vC-lugar-ic, .vC-lugar-seguir.vC-aceso .vC-lugar-ic { background: var(--ouro); color: var(--carta); border-style: solid; }
.vC-lugar-seguir.vC-aceso { background: color-mix(in srgb, var(--ouro) 22%, transparent); border-style: solid; }
.vC-movendo .vC-lugar { opacity: 1; }
.vC-sem-carta .vC-lugar { opacity: .35; pointer-events: none; }
/* quando o dourado não basta (falta a frase, ou não tem volta) */
.vC-lugar-seguir.vC-bloq { border-color: var(--aviso); color: var(--aviso); background: transparent; }
.vC-lugar-seguir.vC-bloq b { color: var(--aviso); }
.vC-lugar-seguir.vC-bloq-nao { border-color: var(--nao); color: var(--nao); }
.vC-lugar-seguir.vC-bloq-nao b { color: var(--nao); }
.vC-lugar-seguir.vC-bloq .vC-lugar-ic::before { content: '!'; font-weight: 800; }
.vC-lugar-seguir.vC-bloq .vC-lugar-ic { font-size: 0; }
.vC-lugar-seguir.vC-bloq .vC-lugar-ic::before { font-size: 1.4rem; }
.vC-pulsa { animation: vC-pulsa .5s ease; }
@keyframes vC-pulsa { 30% { transform: scale(1.07); } }

.vC-pe { display: none; }

/* ---- a mão ---- */
.vC-mao { position: relative; flex: none; height: 188px; transition: background .2s ease; }
.vC-mao-rot { position: absolute; top: 10px; left: 24px; font-size: .74rem; color: var(--tinta-suave); z-index: 1; }
.vC-mao-rot b { font-family: var(--serifa); font-size: .9rem; color: var(--tinta); font-weight: 600; }
.vC-leque { position: absolute; inset: 0; }
.vC-namao {
  position: absolute; left: 50%; bottom: 20px; width: 190px; height: 138px;
  --vC-x: 0px; --vC-y: 0px; --vC-rot: 0deg; --vC-dx: 0px; --vC-dy: 0px;
  transform: translate(var(--vC-dx), var(--vC-dy)) translateX(calc(-50% + var(--vC-x))) translateY(var(--vC-y)) rotate(var(--vC-rot));
  transform-origin: 50% 120%; transition: transform .22s ease, opacity .2s ease, filter .2s ease; touch-action: none;
}
.vC-namao .oc-mini { height: 100%; overflow: hidden; cursor: grab; justify-content: flex-start; }
.vC-namao .oc-mini b { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; flex: none; }
.vC-namao .oc-mini .dest { margin-top: auto; }
.vC-namao:hover, .vC-namao:focus-within { transform: translate(var(--vC-dx), var(--vC-dy)) translateX(calc(-50% + var(--vC-x))) translateY(calc(var(--vC-y) - 40px)) rotate(0deg) scale(1.05); z-index: 60 !important; }
.vC-namao.vC-arrastando { transition: none; z-index: 80 !important; transform: translate(var(--vC-dx), var(--vC-dy)) translateX(calc(-50% + var(--vC-x))) translateY(var(--vC-y)) rotate(0deg) scale(1.08); }
.vC-namao.vC-arrastando .oc-mini { cursor: grabbing; box-shadow: 0 24px 50px rgba(0, 0, 0, .55); }
.vC-adiada .oc-mini { filter: saturate(.25) brightness(.62); }
.vC-adiada:hover .oc-mini { filter: none; }
.vC-volta { position: absolute; top: -9px; left: 50%; transform: translateX(-50%); white-space: nowrap; font-size: .6rem; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; background: var(--carta); color: var(--tinta-suave); border: 1px solid var(--carta-borda); border-radius: 999px; padding: 1px 8px; z-index: 2; }
.vC-num { position: absolute; bottom: 6px; right: 7px; z-index: 2; background: var(--carta); }
.vC-chega { animation: vC-chega .5s ease; }
@keyframes vC-chega { from { opacity: 0; filter: brightness(1.8); } }
.vC-mao-vazia { position: absolute; inset: 0; display: grid; place-items: center; font-size: .82rem; color: var(--tinta-suave); }
.vC-devolver { display: none; }
.vC-mao.vC-quente { background: color-mix(in srgb, var(--ouro) 10%, transparent); }
.vC-mao.vC-quente .vC-devolver { display: grid; position: absolute; inset: 8px 12px; place-items: center; border: 2px dashed var(--ouro); border-radius: 16px; color: var(--ouro); font-family: var(--serifa); font-size: 1rem; z-index: 90; background: color-mix(in srgb, var(--fundo) 70%, transparent); }

/* A face escondida da carta (verso, ou a frente quando virada) segue "por cima" para o toque e rouba a rolagem
   com o dedo: no celular a carta não rolava. Só a face visível recebe ponteiro. (Bug da base; remendo local.) */
.vC-jogada .oc-carta:not(.virada) .oc-face.verso, .vC-jogada .oc-carta.virada .oc-face.frente { pointer-events: none; }

/* o aviso de destravado aparece acima do lugar dourado, onde a carta caiu: não tapa a carta nova nem a mão */
.vC-raiz ~ .oc-toast { top: 18px; bottom: auto; left: auto; right: 30px; width: max-content; max-width: max(220px, calc((100% - 650px) / 2)); transform: translateY(-10px); }
.vC-raiz ~ .oc-toast.on { transform: none; }

/* ===================================================================================================
   CELULAR: a mão vira a fileira do rodapé; a carta aberta ocupa o resto; o gesto é o botão dourado.
   =================================================================================================== */
@container vista (max-width: 640px) {
  .vC-mesa { margin: 0; border-radius: 0; border: 0; padding: 0 10px; box-shadow: none; display: flex; flex-direction: column; align-items: stretch; gap: 0; background: transparent; }
  .vC-topo { position: static; flex: none; flex-direction: row; align-items: baseline; justify-content: space-between; gap: 8px; padding: 6px 4px 6px; }
  .vC-topo-n { font-size: .88rem; }
  .vC-topo-n b { font-size: 1.1rem; }
  .vC-topo-x { font-size: .6rem; text-align: right; }
  .vC-lugar { display: none; }
  .vC-centro { flex: 1; min-height: 0; height: auto; }
  .vC-jogada.vC-arrastando .oc-face { box-shadow: 0 -10px 40px rgba(0, 0, 0, .5); }
  .vC-pe { display: block; flex: none; padding: 8px 2px 8px; }
  .vC-seguir-btn {
    width: 100%; min-height: 50px; border: 0; border-radius: 14px; background: var(--ouro); color: var(--carta);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; padding: 6px 12px; box-shadow: var(--sombra);
    transition: transform .15s ease, background .2s ease;
  }
  .vC-seguir-btn b { font-size: .96rem; }
  .vC-seguir-btn small { font-family: var(--serifa); font-size: .8rem; opacity: .9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .vC-seguir-btn:active { transform: scale(.98); }
  .vC-seguir-btn.vC-bloq { background: transparent; color: var(--aviso); box-shadow: inset 0 0 0 2px var(--aviso); }
  .vC-seguir-btn.vC-bloq-nao { color: var(--nao); box-shadow: inset 0 0 0 2px var(--nao); }
  .vC-seguir-btn.vC-aceso { background: var(--sim); }
  .vC-sem-carta .vC-pe { visibility: hidden; }

  .vC-mao { height: 124px; border-top: 1px solid var(--carta-borda); background: rgba(0, 0, 0, .14); }
  .tema-claro .vC-mao { background: rgba(0, 0, 0, .05); }
  .vC-mao-rot { top: 6px; left: 14px; font-size: .66rem; }
  .vC-mao-rot b { font-size: .8rem; }
  .vC-leque {
    top: 24px; display: flex; gap: 8px; padding: 6px 14px 10px; overflow-x: auto; overflow-y: hidden;
    scroll-snap-type: x mandatory; scroll-padding: 0 14px; scrollbar-width: none; -webkit-overflow-scrolling: touch;
  }
  .vC-leque::-webkit-scrollbar { display: none; }
  .vC-namao { position: relative; left: auto; bottom: auto; flex: none; width: 132px; height: 86px; transform: none !important; scroll-snap-align: start; touch-action: pan-x; }
  .vC-namao .oc-mini { padding: 6px 8px; gap: 2px; border-radius: 10px; box-shadow: 0 3px 10px rgba(0, 0, 0, .3); cursor: pointer; }
  .vC-namao .oc-mini .topo small { font-size: .5rem; letter-spacing: .1em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .vC-namao .oc-mini .topo .glifo { width: 13px; height: 13px; flex: none; }
  .vC-namao .oc-mini .topo .urg { font-size: .5rem; }
  .vC-namao .oc-mini b { font-size: .7rem; -webkit-line-clamp: 3; line-height: 1.18; }
  .vC-namao .oc-mini .dest { display: none; }
  .vC-volta { top: auto; bottom: 4px; font-size: .5rem; padding: 0 6px; }
  .vC-mao.vC-quente .vC-devolver { inset: 4px 8px; }
  .vC-raiz ~ .oc-toast { top: 4px; left: 50%; right: auto; max-width: 94%; transform: translateX(-50%) translateY(-10px); }
  .vC-raiz ~ .oc-toast.on { transform: translateX(-50%); }
}

/* ===================================================================================================
   Variante D — O QUE DESTRAVA (classes vD-)
   =================================================================================================== */
.vD-raiz { position: absolute; inset: 0; display: grid; grid-template-columns: minmax(0, 1fr) 0px; transition: grid-template-columns .3s ease; }
.vD-raiz.com-folha { grid-template-columns: minmax(0, 1fr) 480px; }
.vD-mesa { position: relative; min-width: 0; min-height: 0; display: flex; flex-direction: column; }

/* Topo: quantas coisas estão paradas esperando você */
.vD-topo { flex: none; display: grid; grid-template-columns: 1fr auto; gap: 4px 20px; align-items: end; padding: 12px 24px 8px; border-bottom: 1px solid var(--carta-borda); }
.vD-titulo { margin: 0; font-family: var(--serifa); font-weight: 600; font-size: 1.45rem; line-height: 1.15; }
.vD-titulo .vD-n { color: var(--nao); font-size: 1.15em; }
.vD-titulo small { display: inline-block; margin-left: 12px; font-family: var(--sem-serifa); font-weight: 400; font-size: .74rem; letter-spacing: .1em; text-transform: uppercase; color: var(--tinta-suave); vertical-align: middle; }
.vD-sub { grid-column: 1 / -1; margin: 0; font-size: .82rem; line-height: 1.4; color: var(--tinta-suave); max-width: 980px; }
.vD-legenda { display: flex; gap: 14px; font-size: .68rem; letter-spacing: .1em; text-transform: uppercase; color: var(--tinta-suave); padding-bottom: 4px; }
.vD-legenda span { display: flex; align-items: center; gap: 6px; }
.vD-legenda i { width: 30px; height: 8px; border-radius: 4px; display: inline-block; }
.vD-legenda .p i { background: repeating-linear-gradient(45deg, var(--nao), var(--nao) 4px, transparent 4px, transparent 8px); }
.vD-legenda .a i { background: var(--sim); }

.vD-corpo { flex: 1; min-height: 0; overflow: auto; padding: 8px 24px 64px; scrollbar-width: thin; -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 18px), transparent); mask-image: linear-gradient(to bottom, #000 calc(100% - 18px), transparent); }

/* Grupos por quadro */
.vD-grupos { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 14px 30px; align-items: start; }
.vD-grupo h3 { margin: 0 0 6px; padding-bottom: 4px; border-bottom: 1px solid var(--carta-borda); display: flex; align-items: baseline; gap: 10px; font-weight: 400; }
.vD-quadro { font-family: var(--serifa); font-size: .78rem; letter-spacing: .18em; text-transform: uppercase; color: var(--tinta); }
.vD-grupo h3 small { margin-left: auto; font-size: .7rem; color: var(--nao); font-weight: 700; }
.vD-grupo.vD-grupo-livre h3 small { color: var(--sim); }
.vD-tudo { font-size: .64rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--carta); background: var(--nao); border-radius: 999px; padding: 2px 9px; }
.vD-heroi { margin-bottom: 10px; }
.vD-lista { display: flex; flex-direction: column; gap: 6px; }

/* A trava: o que parou, a barra listrada e, sobre ela, a carta que destrava */
.vD-trava { container: vDtrava / inline-size; position: relative; transition: height .35s ease, opacity .35s ease, margin .35s ease; }
.vD-trava.vD-sai { opacity: 0; overflow: hidden; margin-top: -6px; }
.vD-trava-in { display: grid; grid-template-columns: minmax(0, 1fr); row-gap: 6px; }

.vD-coisa { grid-row: 1; grid-column: 1; min-width: 0; }
.vD-nome { font-family: var(--serifa); font-size: 1.02rem; line-height: 1.2; font-weight: 600; transition: color .4s; }
.vD-baixo { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; margin-top: 1px; }
.vD-estado { font-size: .62rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--nao); transition: color .4s; }
.vD-desde { font-size: .7rem; color: var(--tinta-suave); }

.vD-trilho { grid-row: 2; grid-column: 1; align-self: center; position: relative; height: 12px; border-radius: 6px; overflow: hidden; background: repeating-linear-gradient(45deg, color-mix(in srgb, var(--nao) 80%, transparent), color-mix(in srgb, var(--nao) 80%, transparent) 6px, transparent 6px, transparent 11px); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--nao) 45%, transparent); }
.vD-trilho::after { content: ''; position: absolute; inset: 0; background: var(--sim); transform: scaleX(0); transform-origin: left; transition: transform .55s ease; }
.vD-poe { grid-row: 2; grid-column: 1; position: relative; z-index: 1; margin: 0 16px 0 34px; min-width: 0; }

/* A carta fechada, com o botão de destravar */
.vD-trava .oc-mini { cursor: pointer; gap: 2px; padding: 7px 12px 7px; transition: transform .15s ease, box-shadow .15s ease; }
.vD-trava .oc-mini:hover { transform: translateY(-2px); }
.vD-trava .oc-mini:focus-visible { outline: 2px solid var(--ouro); outline-offset: 2px; }
.vD-trava .oc-mini .dest { display: none; } /* a faixa acima já diz o que destrava */
.vD-trava .oc-mini .topo .urg { display: none; } /* o "parado" já está na faixa; o atraso pinta o "desde" */
.vD-trava.vD-atrasada .vD-desde { color: var(--nao); }
.vD-trava.aberta .oc-mini { box-shadow: 0 0 0 2px var(--ouro), var(--sombra); }
.vD-pe { display: flex; align-items: center; gap: 4px 12px; flex-wrap: wrap; margin-top: 4px; }
.vD-btn { position: relative; overflow: hidden; border: 0; border-radius: 10px; min-height: 34px; padding: 6px 16px; font-size: .86rem; font-weight: 800; letter-spacing: .02em; background: var(--ouro); color: var(--carta); box-shadow: 0 2px 8px rgba(0, 0, 0, .25); touch-action: manipulation; }
.vD-btn:hover { filter: brightness(1.08); }
.vD-btn:focus-visible { outline: 2px solid var(--tinta); outline-offset: 2px; }
.vD-segue { flex: 1 1 150px; min-width: 0; font-size: .72rem; line-height: 1.3; color: var(--tinta-suave); }
.vD-segue b { color: var(--tinta); font-weight: 600; }
/* segurar para o que não tem volta */
.vD-segurar { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: none; }
.vD-segurar .vD-btn-txt { position: relative; }
.vD-segurar .vD-enche { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--nao); opacity: .85; }
.vD-segurar.segurando .vD-enche { width: 100%; transition: width 1.2s linear; }

/* Destravou: a barra vira verde lisa, a carta sobe e sai */
.vD-trava.andando .vD-trilho::after { transform: scaleX(1); }
.vD-trava.andando .vD-nome { color: var(--sim); }
.vD-trava.andando .vD-estado { color: var(--sim); }
.vD-trava.adiada .vD-trilho { opacity: .35; }
.vD-trava.adiada .vD-estado { color: var(--tinta-suave); }
/* sai no próprio lugar (subir por cima da trava de cima sobrepunha as cartas) */
.vD-poe.vD-sai-carta { pointer-events: none; animation: vD-sai-carta .42s ease forwards; }
@keyframes vD-sai-carta { to { transform: translateY(-8px) scale(.94); opacity: 0; } }
/* Estreita: a carta some de vez e a barra verde sobe para logo abaixo do nome (sem buraco onde a carta estava) */
@container vDtrava (max-width: 519px) { .vD-trava.vD-sem-carta .vD-poe { display: none; } }
.vD-poe.vD-volta { animation: vD-volta .35s ease; }
@keyframes vD-volta { from { transform: translateY(-40%) scale(.95); opacity: 0; } }

/* A trava maior: a que trava tudo */
.vD-grande .vD-nome { font-size: 1.4rem; }
.vD-grande .vD-desde { font-size: .78rem; }
.vD-grande .vD-trilho { height: 18px; border-radius: 9px; }
.vD-grande .oc-mini { padding: 9px 16px 9px; border-width: 2.5px; }
.vD-grande .oc-mini .topo small { font-size: .64rem; }
.vD-grande .oc-mini > b { font-size: 1.06rem; line-height: 1.25; }
.vD-grande .vD-btn { min-height: 38px; padding: 7px 22px; font-size: .94rem; }

/* Larga (PC): o nome à esquerda, a barra corre por baixo dele até a carta, à direita */
@container vDtrava (min-width: 520px) {
  .vD-trava-in { grid-template-columns: minmax(150px, 34%) minmax(0, 1fr); }
  .vD-coisa { grid-row: 1; grid-column: 1; display: grid; grid-template-rows: 1fr 22px 1fr; padding-right: 14px; }
  .vD-cima { grid-row: 1; align-self: end; }
  .vD-baixo { grid-row: 3; align-self: start; margin-top: 0; }
  .vD-trilho { grid-row: 1; grid-column: 1 / -1; }
  .vD-poe { grid-row: 1; grid-column: 2; margin: 0 14px 0 0; }
  .vD-grande .vD-trava-in { grid-template-columns: minmax(200px, 36%) minmax(0, 1fr); }
  .vD-grande .vD-coisa { grid-template-rows: 1fr 30px 1fr; }
  .vD-grande .vD-poe { justify-self: end; width: min(100%, 640px); margin-right: 24px; }
}

/* Aviso com Desfazer */
.vD-aviso { position: absolute; right: 24px; bottom: 16px; z-index: 40; transform: translate(0, 20px); opacity: 0; pointer-events: none; transition: opacity .3s ease, transform .3s ease; display: flex; align-items: center; gap: 10px; width: max-content; max-width: min(92%, 480px); padding: 9px 8px 11px 14px; border-radius: 12px; overflow: hidden; background: var(--tinta); color: var(--carta); box-shadow: var(--sombra); font-size: .82rem; line-height: 1.35; }
.vD-aviso.on { opacity: 1; transform: translate(0, 0); pointer-events: auto; }
.vD-aviso-txt { min-width: 0; }
.vD-aviso-txt b { color: color-mix(in srgb, var(--sim) 70%, var(--carta)); margin-right: 4px; }
.vD-aviso-txt b.neutro { color: inherit; margin: 0; }
.vD-desfazer { flex: none; border: 1.5px solid currentColor; background: transparent; color: inherit; border-radius: 999px; padding: 5px 12px; font-size: .78rem; font-weight: 800; }
.vD-tempo { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: var(--ouro); transform-origin: left; }
.vD-aviso.on .vD-tempo { animation: vD-tempo 4s linear forwards; }
@keyframes vD-tempo { from { transform: scaleX(1); } to { transform: scaleX(0); } }

/* Folha com a carta inteira — PC: à direita, altura toda */
.vD-folha { position: relative; min-width: 0; min-height: 0; overflow: hidden; border-left: 1px solid transparent; background: var(--fundo-veio); transition: border-color .3s; }
.com-folha > .vD-folha { border-left-color: var(--carta-borda); }
.vD-folha-in { width: 480px; height: 100%; display: flex; flex-direction: column; }
.vD-folha-topo { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 16px 6px; }
.vD-folha-rot { min-width: 0; font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; color: var(--tinta-suave); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vD-fechar { flex: none; border: 1px solid var(--carta-borda); background: transparent; border-radius: 999px; padding: 4px 12px; font-size: .76rem; color: var(--tinta-suave); }
.vD-fechar:hover { color: var(--tinta); border-color: var(--ouro); }
.vD-folha-carta { flex: 1; min-height: 0; padding: 2px 14px 14px; }
.vD-alca, .vD-veu { display: none; }

/* Celular: lista vertical por quadro; a carta abre de baixo para cima, quase a tela toda */
@container vista (max-width: 640px) {
  .vD-raiz, .vD-raiz.com-folha { grid-template-columns: minmax(0, 1fr); }
  .vD-topo { grid-template-columns: 1fr; padding: 14px 16px 10px; gap: 4px; }
  .vD-titulo { font-size: 1.32rem; }
  .vD-titulo small { display: block; margin: 3px 0 0; font-size: .66rem; }
  .vD-legenda { display: none; }
  .vD-sub { font-size: .76rem; }
  .vD-corpo { padding: 12px 16px 84px; }
  .vD-grupos { grid-template-columns: minmax(0, 1fr); gap: 18px; }
  .vD-heroi { margin-bottom: 18px; }
  .vD-poe { margin: 0 10px 0 22px; }
  .vD-grande .vD-nome { font-size: 1.22rem; }
  .vD-grande .oc-mini > b { font-size: 1.02rem; }

  .vD-folha { position: absolute; left: 0; right: 0; bottom: 0; top: 30px; z-index: 50; border-left: 0; border-radius: 18px 18px 0 0; transform: translateY(103%); transition: transform .32s ease; box-shadow: 0 -12px 30px rgba(0, 0, 0, .45); }
  .vD-folha.arrastando { transition: none; }
  .vD-raiz.com-folha .vD-folha { transform: translateY(0); }
  .vD-folha-in { width: auto; }
  .vD-alca { display: flex; justify-content: center; flex: none; }
  .vD-alca button { border: 0; background: transparent; padding: 8px 40px 4px; touch-action: none; }
  .vD-alca i { display: block; width: 44px; height: 5px; border-radius: 3px; background: var(--tinta-suave); opacity: .7; }
  .vD-folha-topo { padding: 2px 14px 6px; }
  .vD-folha-carta { padding: 0 10px 12px; }
  .vD-veu { display: block; position: absolute; inset: 0; z-index: 45; background: rgba(0, 0, 0, .5); opacity: 0; pointer-events: none; transition: opacity .3s ease; }
  .vD-raiz.com-folha .vD-veu { opacity: 1; pointer-events: auto; }
  .vD-aviso { left: 50%; right: auto; bottom: 12px; transform: translate(-50%, 20px); }
  .vD-aviso.on { transform: translate(-50%, 0); }
}

/* Mesa limpa */
.vD-vazia { height: 100%; min-height: 360px; }
.vD-vazia > div { display: flex; flex-direction: column; align-items: center; gap: 2px; max-width: 320px; }
.vD-vazia span { font-size: .86rem; line-height: 1.4; }

  /* ------------------------------------------------------------------------------------------------
     utilidades
     ------------------------------------------------------------------------------------------------ */
  function el(tag, cls, html) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    return e;
  }
  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; });
  }
  function copia(x) { return JSON.parse(JSON.stringify(x)); }

  /* ------------------------------------------------------------------------------------------------
     VISUAIS (um por carta, tipado)
     ------------------------------------------------------------------------------------------------ */
  function visual(v, card) {
    if (!v) return null;
    var box = el('div', 'oc-vis oc-vis-' + v.tipo);
    box.appendChild(el('h5', null, esc(v.titulo) + (v.nota ? '<i>' + esc(v.nota) + '</i>' : '')));
    if (v.tipo === 'checagens') {
      var ul = el('ul', 'oc-luzes');
      v.itens.forEach(function (it) {
        ul.appendChild(el('li', it[0], '<i>' + (it[0] === 'ok' ? '✓' : it[0] === 'nao' ? '✕' : '!') + '</i><b>' + esc(it[1]) + '</b><span>' + esc(it[2]) + '</span>'));
      });
      box.appendChild(ul);
    } else if (v.tipo === 'passos') {
      var ol = el('ol', 'oc-passos');
      v.passos.forEach(function (p) { ol.appendChild(el('li', null, '<div>' + esc(p[0]) + '<small>' + esc(p[1]) + '</small></div>')); });
      box.appendChild(ol);
      if (v.parado) box.appendChild(el('div', 'oc-parado', '<span class="trilho"></span><b>' + esc(v.parado) + '</b>'));
    } else if (v.tipo === 'grade') {
      var g = el('div', 'oc-grade');
      v.dias.forEach(function (d, i) {
        var col = el('div', 'col');
        col.appendChild(el('div', 'dia', esc(d)));
        v.blocos[i].forEach(function (b) { col.appendChild(el('div', 'bloco' + (b[1] ? ' ' + b[1] : ''), esc(b[0]))); });
        g.appendChild(col);
      });
      box.appendChild(g);
    } else if (v.tipo === 'comparacao') {
      var c = el('div', 'oc-comp');
      v.telas.forEach(function (t, i) {
        var f = el('figure');
        var b = el('button', 'ver');
        b.type = 'button';
        var tela = el('div', 'tela' + (t.rec ? ' rec' : ''));
        if (t.rec) tela.appendChild(el('span', 'selo-rec', 'recomendo'));
        if (t.forma === 'lista') {
          tela.innerHTML += '<span class="faixa">seus pedidos</span><div class="l o"></div><div class="l a"></div><div class="l"></div><div class="l a"></div><div class="l"></div><div class="l"></div>';
        } else if (t.forma === 'colunas') {
          tela.innerHTML += '<span class="faixa">por quadro</span><div class="cols"><div><div class="l a"></div><div class="l"></div></div><div><div class="l o"></div><div class="l"></div><div class="l"></div></div><div><div class="l v"></div></div></div>';
        } else {
          tela.innerHTML += '<span class="faixa">agora</span><div class="l o"></div><div class="l o"></div><span class="faixa">próximas</span><div class="l a"></div><span class="faixa">depois</span><div class="l"></div>';
        }
        b.appendChild(tela);
        b.addEventListener('click', function () { abrirTela(box, t, i); });
        f.appendChild(b);
        f.appendChild(el('figcaption', null, esc(t.rotulo)));
        c.appendChild(f);
      });
      box.appendChild(c);
    } else if (v.tipo === 'texto') {
      if (v.pedidoDe) box.appendChild(el('blockquote', 'oc-citacao', esc(v.pedidoDe.texto) + '<small>' + esc(v.pedidoDe.de) + '</small>'));
      box.appendChild(el('div', 'oc-msg-dest', 'Para <b>' + esc(v.para) + '</b> · você pode editar'));
      var ta = el('textarea', 'oc-msg oc-msg-edit');
      ta.value = v.texto;
      ta.rows = 5;
      ta.style.width = '100%';
      ta.style.font = 'inherit';
      ta.style.color = 'inherit';
      ta.setAttribute('aria-label', 'Mensagem a enviar');
      box.appendChild(ta);
      card._textoOriginal = v.texto;
    } else if (v.tipo === 'volta') {
      box.appendChild(el('div', 'oc-volta', '<div class="nao-volta"><b>Não volta</b>' + esc(v.naoVolta) + '</div><div class="volta"><b>Tem volta</b>' + esc(v.volta) + '</div>'));
    } else if (v.tipo === 'medidor') {
      var m = el('div', 'oc-medidor');
      v.linhas.forEach(function (l) {
        m.appendChild(el('div', 'linha', '<div class="rot"><span>' + esc(l.rot) + '</span><b>' + esc(l.valor) + '</b></div><div class="barra"><div class="' + l.cls + '" style="width:' + l.pct + '%"></div></div>'));
      });
      if (v.zero) m.appendChild(el('div', 'linha', '<div class="rot"><span>' + esc(v.zero.rot) + '</span><span class="zero">' + esc(v.zero.valor) + '</span></div>'));
      box.appendChild(m);
    }
    return box;
  }

    if (velho) velho.remove();
