    a.style.cssText = 'margin-top:8px;border:1px solid var(--carta-borda);border-radius:8px;background:#151a21;color:#d7dde5;padding:10px;font:12px/1.4 var(--font-ui)';
    var linhas = {
      lista: '<b style="color:#e8b44c">Seus pedidos</b> · arraste para mudar a ordem<ol style="margin:6px 0 0;padding-left:18px"><li>Oráculo volta a ser mesa de tiragem <span style="color:#828d9c">· Donel Dev</span></li><li>Limpeza final da trava de carta <span style="color:#828d9c">· Theo</span></li><li>Ledger só registra <span style="color:#828d9c">· Donel Dev</span></li><li>Dono nunca entra em outra sessão <span style="color:#828d9c">· Donel Dev</span></li></ol>',
      colunas: '<b style="color:#e8b44c">Uma coluna por quadro</b><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px"><div>Donel Dev · 4<br><span style="color:#828d9c">mesa de tiragem<br>ledger só registra</span></div><div>BizOps · 4<br><span style="color:#828d9c">token da VPS<br>1:1s</span></div><div>Homologação · 3<br><span style="color:#828d9c">chave do AI Hub</span></div></div>',
      faixas: '<b style="color:#e8b44c">Agora</b> · mesa de tiragem, chave do AI Hub<br><b style="color:#4c9cf0">Próximas</b> · ledger só registra, âncora do proxy<br><b style="color:#828d9c">Depois</b> · faxina, gatilho de swap',
    };
    a.innerHTML = '<div style="display:flex;justify-content:space-between;margin-bottom:4px"><span style="color:#828d9c">' + esc(t.rotulo) + '</span><button type="button" style="background:none;border:0;color:#828d9c">fechar</button></div>' + linhas[t.forma];
    a.querySelector('button').addEventListener('click', function () { a.remove(); });
    box.appendChild(a);
  }

  /* ------------------------------------------------------------------------------------------------
     RESPOSTAS (o jeito de responder muda com a decisão)
     ------------------------------------------------------------------------------------------------ */
  function resposta(card, decidir) {
    var r = card.resposta;
    var wrap = el('div', 'oc-resp oc-resp-' + r.tipo);

    function caminho(c, extraCls) {
      var b = el('button', 'oc-caminho' + (c.rec ? ' rec' : '') + (extraCls ? ' ' + extraCls : ''));
      b.type = 'button';
      b.innerHTML = '<b>' + esc(c.rotulo) + '</b>' + (c.rec ? '<em>recomendo</em>' : '<i></i>') + '<span>' + esc(c.efeito) + '</span>';
      return b;
    }

    if (r.tipo === 'caminhos' || r.tipo === 'fiz' || r.tipo === 'variante') {
      var lista = el('div', 'oc-caminhos');
      r.caminhos.forEach(function (c) {
        var b = caminho(c);
        // Dois toques: o primeiro arma, o segundo confirma (evita decisão por engano).
        b.addEventListener('click', function () {
          if (b.classList.contains('armado')) { decidir({ caminho: c.rotulo, rec: !!c.rec }); return; }
          lista.querySelectorAll('.armado').forEach(function (o) { o.classList.remove('armado'); var x = o.querySelector('.confirma'); if (x) x.remove(); });
          b.classList.add('armado');
          b.appendChild(el('span', 'confirma', 'Toque de novo para confirmar'));
        });
        lista.appendChild(b);
      });
      wrap.appendChild(lista);
    } else if (r.tipo === 'livre') {
      var campo = el('div', 'oc-campo');
      campo.appendChild(el('label', null, esc(r.rotulo)));
      var ta = el('textarea');
      ta.placeholder = r.placeholder;
      campo.appendChild(ta);
      var acoes = el('div', 'acoes');
      var env = el('button', 'oc-btn ouro', esc(r.enviar));
      env.type = 'button';
      env.disabled = true;
      ta.addEventListener('input', function () { env.disabled = !ta.value.trim(); });
      env.addEventListener('click', function () { decidir({ caminho: r.enviar, texto: ta.value.trim(), rec: true }); });
      acoes.appendChild(env);
      campo.appendChild(acoes);
      campo.appendChild(el('div', null, '<span style="font-size:.74rem;color:var(--tinta-suave)">' + esc(r.efeito) + '</span>'));
      wrap.appendChild(campo);
      var alt = caminho({ rotulo: r.alternativa.rotulo, efeito: r.alternativa.efeito });
      alt.style.marginTop = '8px';
      alt.addEventListener('click', function () {
        if (alt.classList.contains('armado')) { decidir({ caminho: r.alternativa.rotulo }); return; }
        alt.classList.add('armado');
        alt.appendChild(el('span', 'confirma', 'Toque de novo para confirmar'));
      });
      wrap.appendChild(alt);
    } else if (r.tipo === 'texto') {
      var l2 = el('div', 'oc-caminhos');
      var botoes = {};
      r.caminhos.forEach(function (c) {
        var b = caminho(c);
        botoes[c.rotulo] = b;
        b.addEventListener('click', function () {
          var t = card._raiz && card._raiz.querySelector('.oc-msg-edit');
          var editado = t && t.value !== card._textoOriginal;
          if (c.rotulo === 'Enviar editado' && !editado) { t && t.focus(); return; }
          if (b.classList.contains('armado')) { decidir({ caminho: c.rotulo, texto: t ? t.value : '', rec: !!c.rec }); return; }
          l2.querySelectorAll('.armado').forEach(function (o) { o.classList.remove('armado'); var x = o.querySelector('.confirma'); if (x) x.remove(); });
          b.classList.add('armado');
          b.appendChild(el('span', 'confirma', 'Toque de novo para enviar'));
        });
        l2.appendChild(b);
      });
      // "Enviar editado" só acende quando o texto muda.
      setTimeout(function () {
        var t = card._raiz && card._raiz.querySelector('.oc-msg-edit');
        var be = botoes['Enviar editado'];
        if (!t || !be) return;
        be.style.opacity = '.45';
        t.addEventListener('input', function () {
          var mudou = t.value !== card._textoOriginal;
          be.style.opacity = mudou ? '1' : '.45';
          botoes['Enviar como está'].style.opacity = mudou ? '.45' : '1';
        });
      }, 0);
      wrap.appendChild(l2);
    } else if (r.tipo === 'lote') {
      var itens = el('div', 'oc-itens');
      r.itens.forEach(function (it, i) {
        var d = el('div', 'oc-item');
        d.innerHTML = '<span class="t">' + (i + 1) + '. ' + esc(it.t) + '</span><span class="alterna"><button type="button" aria-pressed="true" class="ok">Aceito</button><button type="button" aria-pressed="false" class="troca">Mudar</button></span><span class="r"><b>Recomendo:</b> ' + esc(it.r) + '</span>' + (it.alt ? '<span class="alt">' + esc(it.alt) + '</span>' : '');
        if (it.num) {
          var n = el('div', 'oc-num');
          it.num.forEach(function (p) {
            var lab = el('label', null, esc(p[0]) + ' <button type="button" aria-label="menos">−</button><output>' + p[1] + '</output><button type="button" aria-label="mais">+</button>');
            var out = lab.querySelector('output');
            var bs = lab.querySelectorAll('button');
            bs[0].addEventListener('click', function () { out.textContent = Math.max(1, +out.textContent - 1); });
            bs[1].addEventListener('click', function () { out.textContent = +out.textContent + 1; });
            n.appendChild(lab);
          });
          d.appendChild(n);
        }
        var nota = el('span', 'nota', '<input type="text" placeholder="O que muda nesta? (as outras seguem)">');
        d.appendChild(nota);
        var bOk = d.querySelector('.alterna .ok');
        var bTr = d.querySelector('.alterna .troca');
        bOk.addEventListener('click', function () { bOk.setAttribute('aria-pressed', 'true'); bTr.setAttribute('aria-pressed', 'false'); d.classList.remove('trocando'); atualizar(); });
        bTr.addEventListener('click', function () { bTr.setAttribute('aria-pressed', 'true'); bOk.setAttribute('aria-pressed', 'false'); d.classList.add('trocando'); d.querySelector('input').focus(); atualizar(); });
        itens.appendChild(d);
      });
      wrap.appendChild(itens);
      var fim = el('button', 'oc-btn ouro');
      fim.type = 'button';
      fim.style.cssText = 'width:100%;margin-top:8px;padding:10px';
      function atualizar() {
        var mudando = itens.querySelectorAll('.trocando').length;
        fim.textContent = mudando ? 'Seguir com ' + (r.itens.length - mudando) + ' e mandar ' + mudando + ' de volta com a sua nota' : r.tudo;
      }
      atualizar();
      fim.addEventListener('click', function () {
        var mudando = itens.querySelectorAll('.trocando').length;
        decidir({ caminho: mudando ? 'Seguir com ' + (r.itens.length - mudando) + ', mudar ' + mudando : r.tudo, rec: !mudando });
      });
      wrap.appendChild(fim);
    } else if (r.tipo === 'segurar') {
      var l3 = el('div', 'oc-caminhos');
      r.caminhos.forEach(function (c) {
        var b = caminho(c, c.segurar ? 'oc-segurar' : '');
        if (c.segurar) {
          b.appendChild(el('span', 'confirma', esc(c.segurar)));
          b.appendChild(el('span', 'enchendo'));
          var timer = null;
          var ini = function (e) { e.preventDefault(); b.classList.add('segurando'); timer = setTimeout(function () { decidir({ caminho: c.rotulo, rec: !!c.rec }); }, 1200); };
          var fimS = function () { b.classList.remove('segurando'); clearTimeout(timer); };
          b.addEventListener('pointerdown', ini);
          b.addEventListener('pointerup', fimS);
          b.addEventListener('pointerleave', fimS);
        } else {
          b.addEventListener('click', function () {
            if (b.classList.contains('armado')) { decidir({ caminho: c.rotulo }); return; }
            b.classList.add('armado');
            b.appendChild(el('span', 'confirma', 'Toque de novo para confirmar'));
          });
        }
        l3.appendChild(b);
      });
      wrap.appendChild(l3);
    }
    return wrap;
  }

  /* ------------------------------------------------------------------------------------------------
     A CARTA INTEIRA
     ctx: { indice: 'I · VIII', aoDecidir(card, res), aoAgoraNao(card, quando), aoDecidaVoce(card) }
     res = { caminho, rec, texto?, tipo: 'decidiu' | 'decida-voce' }
     ------------------------------------------------------------------------------------------------ */
  function carta(card, ctx) {
    ctx = ctx || {};
    var raiz = el('article', 'oc-carta naipe-' + card.naipe);
    raiz.dataset.carta = card.id;
    card._raiz = raiz;
    var giro = el('div', 'oc-giro');
    raiz.appendChild(giro);

    function decidir(res) {
      res.tipo = res.tipo || 'decidiu';
      if (ctx.aoDecidir) ctx.aoDecidir(card, res);
    }

    // ---- frente
    var frente = el('div', 'oc-face frente');
    var mf = el('div', 'oc-moldura');
    var fi = el('div', 'oc-interna');
    mf.appendChild(fi);
    frente.appendChild(mf);
    fi.appendChild(el('div', 'oc-cabeca', '<span class="glifo">' + GLIFOS[card.naipe] + '</span><span class="tipo">' + esc(NAIPES[card.naipe]) + '</span><span class="idx">' + esc(ctx.indice || '') + '</span>'));
    var rol = el('div', 'oc-rolagem');
    fi.appendChild(rol);
    rol.appendChild(el('div', 'oc-meta', '<span>' + esc(card.quadro) + '</span><span class="' + (card.urgente ? 'urgente' : '') + '">' + esc(card.desde) + '</span>'));
    // 1. o que você decide
    rol.appendChild(el('h3', 'oc-pergunta', esc(card.pergunta)));
    rol.appendChild(el('div', 'oc-destrava', '<b>Destrava:</b> ' + esc(card.destrava)));
    // visual primeiro
    if (card.citacao) rol.appendChild(el('blockquote', 'oc-citacao', '"' + esc(card.citacao.texto) + '"<small>' + esc(card.citacao.de) + '</small>'));
    var vis = visual(card.visual, card);
    if (vis) rol.appendChild(vis);
    // 2. recomendação e porquê
    rol.appendChild(el('div', 'oc-rec', 'Recomendo <b>' + esc(card.rec.rotulo) + '</b>: ' + esc(card.rec.porque)));
    // 3. o que acontece em cada caminho (a resposta)
    rol.appendChild(resposta(card, decidir));
    // 4. risco
    rol.appendChild(el('div', 'oc-risco ' + card.risco.nivel, '<i>risco ' + esc(card.risco.nivel) + '</i><span>' + esc(card.risco.texto) + '</span>'));
    rol.appendChild(el('div', 'oc-real', esc(card.real)));

    // saídas de sempre
    var saidas = el('div', 'oc-saidas');
    var g = el('div', 'grupo');
    var bDecida = el('button', null, 'Decida você');
    var bPerg = el('button', null, 'Perguntar');
    var bDepois = el('button', null, 'Agora não');
    [bDecida, bPerg, bDepois].forEach(function (b) { b.type = 'button'; g.appendChild(b); });
    saidas.appendChild(g);
    var bVirar = el('button', 'virar', '↻ Virar');
    bVirar.type = 'button';
    saidas.appendChild(bVirar);
    var painel = el('div', 'oc-saidas-painel');
    fi.appendChild(painel);
    fi.appendChild(saidas);

    bDecida.addEventListener('click', function () {
      painel.className = 'oc-saidas-painel on';
      painel.innerHTML = 'A sessão segue a recomendação (<b>' + esc(card.rec.rotulo) + '</b>) e só volta se algo sair do previsto. <div class="chips"><button type="button" data-ok>Sim, decida você</button><button type="button" data-x>Cancelar</button></div>';
      painel.querySelector('[data-ok]').onclick = function () { decidir({ caminho: card.rec.rotulo, rec: true, tipo: 'decida-voce' }); };
      painel.querySelector('[data-x]').onclick = function () { painel.className = 'oc-saidas-painel'; };
    });
    bPerg.addEventListener('click', function () {
      painel.className = 'oc-saidas-painel on';
      painel.innerHTML = '<textarea placeholder="Sua pergunta. A carta fica na mesa e a resposta volta nela."></textarea><div class="chips"><button type="button" data-ok>Perguntar</button><button type="button" data-x>Cancelar</button></div>';
      painel.querySelector('[data-ok]').onclick = function () {
        var t = painel.querySelector('textarea').value.trim();
        if (!t) return;
        painel.className = 'oc-saidas-painel';
        var e = el('div', 'oc-esperando', '<b>Você perguntou:</b> ' + esc(t) + '<br><span style="color:var(--tinta-suave)">A resposta volta nesta carta. Ela fica na mesa.</span>');
        rol.appendChild(e);
        e.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      };
      painel.querySelector('[data-x]').onclick = function () { painel.className = 'oc-saidas-painel'; };
    });
    bDepois.addEventListener('click', function () {
      painel.className = 'oc-saidas-painel on';
      painel.innerHTML = 'Tirar da mesa sem decidir. Volta: <div class="chips"><button type="button" data-q="em 2 horas">em 2 horas</button><button type="button" data-q="amanhã cedo">amanhã cedo</button><button type="button" data-q="segunda">segunda</button><button type="button" data-x>Cancelar</button></div>';
      painel.querySelectorAll('[data-q]').forEach(function (b) { b.onclick = function () { if (ctx.aoAgoraNao) ctx.aoAgoraNao(card, b.dataset.q); }; });
      painel.querySelector('[data-x]').onclick = function () { painel.className = 'oc-saidas-painel'; };
    });

    // ---- verso
    var verso = el('div', 'oc-face verso');
    var mv = el('div', 'oc-moldura');
    var vi = el('div', 'oc-interna');
    mv.appendChild(vi);
    verso.appendChild(mv);
    vi.appendChild(el('div', 'oc-cabeca', '<span class="glifo">' + GLIFOS[card.naipe] + '</span><span class="tipo">O verso</span><span class="idx">' + esc(ctx.indice || '') + '</span>'));
    var vc = el('div', 'oc-verso-corpo');
    var html = '<h4>Por que recomendo</h4><p>' + esc(card.rec.porque) + '</p>';
    html += '<h4>Cada caminho</h4><dl>' + card.verso.caminhos.map(function (c) { return '<dt>' + esc(c[0]) + '</dt><dd>' + esc(c[1]) + '</dd>'; }).join('') + '</dl>';
    html += '<h4>Quem pediu</h4><p>' + esc(card.verso.quem) + '</p>';
    html += '<details><summary>O pedido, nas palavras de quem pediu</summary><blockquote>' + esc(card.verso.pedido) + '</blockquote></details>';
    html += '<details><summary>Detalhe técnico</summary><div class="tec">' + esc(card.verso.tecnico) + '</div></details>';
    vc.innerHTML = html;
    vi.appendChild(vc);
    var sv = el('div', 'oc-saidas');
    var bVolta = el('button', 'virar', '↻ Frente');
    bVolta.type = 'button';
    sv.appendChild(el('span', null, ''));
    sv.appendChild(bVolta);
    vi.appendChild(sv);

    bVirar.addEventListener('click', function () { raiz.classList.add('virada'); });
    bVolta.addEventListener('click', function () { raiz.classList.remove('virada'); });

    giro.appendChild(frente);
    giro.appendChild(verso);
    return raiz;
  }

  // A carta fechada (miniatura): naipe, pergunta curta e o que destrava.
  function mini(card, opts) {
    opts = opts || {};
    var b = el(opts.tag || 'button', 'oc-mini naipe-' + card.naipe);
    if (b.tagName === 'BUTTON') b.type = 'button';
    b.dataset.carta = card.id;
    b.innerHTML = '<span class="topo"><span class="glifo">' + GLIFOS[card.naipe] + '</span><small>' + esc(NAIPES[card.naipe]) + '</small>' + (card.urgente ? '<span class="urg">parado</span>' : '') + '</span><b>' + esc(card.pergunta) + '</b><span class="dest"><em>Destrava:</em> ' + esc(card.destravaCurto) + '</span>';
    return b;
  }
  function dorso() { return el('div', 'oc-dorso', VERSO_SVG); }

  // Aviso que mostra o que a decisão destravou.
  function toast(vista, card, res) {
    var t = vista.querySelector('.oc-toast');
    if (!t) { t = el('div', 'oc-toast'); vista.appendChild(t); }
    var o = res.tipo === 'decida-voce' ? 'A sessão segue a recomendação.' : res.tipo === 'agora-nao' ? 'Volta ' + esc(res.quando) + '.' : 'Você escolheu: ' + esc(res.caminho) + '.';
    t.innerHTML = res.tipo === 'agora-nao' ? '<span>Fora da mesa. ' + o + '</span>' : '<b>Destravado</b><span>' + esc(card.destravaCurto) + '. ' + o + '</span>';
    t.classList.add('on');
    clearTimeout(t._h);
    t._h = setTimeout(function () { t.classList.remove('on'); }, 2600);
  }

  window.Oraculo = { CARTAS: CARTAS, GLIFOS: GLIFOS, NAIPES: NAIPES, ROMANOS: ROMANOS, carta: carta, mini: mini, dorso: dorso, toast: toast, el: el, esc: esc, copia: copia };

  /* ------------------------------------------------------------------------------------------------
     CASCA: escolhe variante, tela (PC, celular, os dois) e tema; monta cada variante em cada moldura.
     Cada variante registra-se em window.VARIANTES[letra] = { nome, sobre, montar(vista, cartas) }.
     ------------------------------------------------------------------------------------------------ */
  window.VARIANTES = window.VARIANTES || {};
  document.addEventListener('DOMContentLoaded', function () {
    var letras = Object.keys(window.VARIANTES).sort();
    var estado = { v: (location.hash.replace('#', '') || letras[0]), tela: window.innerWidth < 700 ? 'cel-solo' : 'os-dois', tema: 'escuro' };
    if (letras.indexOf(estado.v) < 0) estado.v = letras[0];
    var barra = document.querySelector('.casca-barra');
    var gv = barra.querySelector('[data-grupo=variante]');
    letras.forEach(function (l) {
      var b = el('button', null, l + ' · ' + esc(window.VARIANTES[l].nome));
      b.type = 'button';
      b.dataset.v = l;
      b.onclick = function () { estado.v = l; desenhar(); };
      gv.appendChild(b);
    });
    barra.querySelectorAll('[data-tela]').forEach(function (b) { b.onclick = function () { estado.tela = b.dataset.tela; desenhar(); }; });
    barra.querySelectorAll('[data-tema]').forEach(function (b) { b.onclick = function () { estado.tema = b.dataset.tema; desenhar(); }; });
    var rb = barra.querySelector('[data-recomecar]');
    if (rb) rb.onclick = function () { desenhar(); };

    document.addEventListener('keydown', function (e) {
      var t = e.target;
      if ((t.matches && t.matches('input, textarea, select')) || t.isContentEditable) return;
      if (!e.altKey) return;
      var i = letras.indexOf(estado.v);
      if (e.key === 'ArrowRight') { estado.v = letras[(i + 1) % letras.length]; desenhar(); }
      if (e.key === 'ArrowLeft') { estado.v = letras[(i - 1 + letras.length) % letras.length]; desenhar(); }
    });

    function moldura(tipo) {
      var w = el('div');
      var vista = el('div', 'vista tema-' + (tipo === 'pc' ? 'escuro' : estado.tema));
      if (tipo === 'pc') {
        w.appendChild(el('div', 'casca-rotulo', 'PC · Donel Dev, Uso geral'));
        var pc = el('div', 'pc');
        pc.appendChild(el('div', 'pc-titulo', '<i></i><i></i><i></i><span>Donel Dev Alfa · Uso geral</span><span class="troca"><b>Oráculo</b><span>Terminais</span></span>'));
        var tela = el('div', 'pc-tela');
        tela.appendChild(vista);
        pc.appendChild(tela);
        w.appendChild(pc);
        if (estado.tema === 'claro') vista.className = 'vista tema-claro';
      } else {
        w.appendChild(el('div', 'casca-rotulo', 'Celular · Oráculo Harrow'));
        var cel = el('div', 'cel');
        var ct = el('div', 'cel-tela tema-' + estado.tema);
        ct.appendChild(el('div', 'cel-status', '<span>16:20</span><span>Tailscale · 82%</span>'));
        ct.appendChild(vista);
        cel.appendChild(ct);
        w.appendChild(cel);
      }
      return { w: w, vista: vista };
    }

    function desenhar() {
      location.hash = estado.v;
      gv.querySelectorAll('button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.v === estado.v)); });
      barra.querySelectorAll('[data-tela]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.tela === estado.tela || (estado.tela === 'cel-solo' && b.dataset.tela === 'cel'))); });
      barra.querySelectorAll('[data-tema]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.tema === estado.tema)); });
      var V = window.VARIANTES[estado.v];
      document.querySelector('.casca-sobre').innerHTML = '<b>' + esc(estado.v + ' · ' + V.nome) + '.</b> ' + V.sobre;
      var palco = document.querySelector('.casca-palco');
      palco.innerHTML = '';
      var telas = estado.tela === 'os-dois' ? ['cel', 'pc'] : estado.tela === 'cel-solo' ? ['cel'] : [estado.tela];
      telas.forEach(function (t) {
        var m = moldura(t);
        palco.appendChild(m.w);
        V.montar(m.vista, copia(CARTAS));
      });
      // celular de verdade (tela estreita): a moldura some e a vista ocupa a tela
      document.body.classList.toggle('no-celular', window.innerWidth < 700);
    }
    desenhar();
  });
})();

</script>
<script>
/* variante A */
/* Variante A — TIRAGEM EM TRÊS CASAS. A mesa é um spread com posições que têm significado:
   "Trava tudo", "Hoje" e "Pode esperar" são pilhas; a carta da vez fica virada e grande no centro;
   o que você decide cai na casa "Destravado", deixando à vista só o que destravou (rastro desta tiragem).
   Destravar: arrastar a carta até "Destravado" (ou o botão dourado) segue a recomendação.
   Celular: faixa de pilhas no alto; arrastar à direita segue, à esquerda "Agora não" (volta amanhã cedo).
   Zero estado global: tudo vive no fechamento de cada montar(). */
window.VARIANTES.A = {
  nome: 'Três casas',
  sobre: 'A mesa é uma tiragem com três casas que dizem a pressa: Trava tudo, Hoje e Pode esperar. '
    + 'A carta de cima da primeira casa com cartas fica virada no centro; clicar numa casa traz a dela. '
    + 'Destravar é arrastar a carta até a casa Destravado (ou o botão dourado): segue a recomendação e deixa ali só o que destravou. '
    + 'No celular, arrastar à direita segue e à esquerda volta amanhã cedo.',
  montar: function (vista, cartas) {
    var O = window.Oraculo;
    var el = O.el, esc = O.esc;

    var CASAS = [
      { k: 'trava', nome: 'Trava tudo', tecla: '1' },
      { k: 'hoje', nome: 'Hoje', tecla: '2' },
      { k: 'espera', nome: 'Pode esperar', tecla: '3' },
    ];
    function casaDe(c) { return (c.urgente || c.peso >= 3) ? 'trava' : c.peso === 2 ? 'hoje' : 'espera'; }

    var pilhas = { trava: [], hoje: [], espera: [] };
    cartas.forEach(function (c) { pilhas[casaDe(c)].push(c); });
    var total = cartas.length;
    var centro = null;      // { card, casa, wrap, raiz }
    var destravados = [];   // { card, res }, o mais novo primeiro
    var adiadas = [];       // { card, quando }
    var saindo = false;     // trava enquanto uma carta voa

    // ------------------------------------------------------------------ estrutura da mesa
    var mesa = el('div', 'vA-mesa');
    var faixa = el('div', 'vA-faixa');
    var lead = el('div', 'vA-lead');
    faixa.appendChild(lead);
    var botoesCasa = {};
    CASAS.forEach(function (c) {
      var b = el('button', 'vA-casa vA-casa-' + c.k);
      b.type = 'button';
      b.title = 'Tirar a carta de cima de "' + c.nome + '" para o centro';
      b.addEventListener('click', function () { b.blur(); tirar(c.k); });
      botoesCasa[c.k] = b;
      faixa.appendChild(b);
    });
    var casaDest = el('button', 'vA-casa vA-casa-dest');
    casaDest.type = 'button';
    casaDest.title = 'Ver o que esta tiragem já destravou';
    casaDest.addEventListener('click', function () { mesa.classList.toggle('vA-rastro-aberto'); });
    faixa.appendChild(casaDest);

    var centroEl = el('div', 'vA-centro');

    var pe = el('div', 'vA-pe');
    var dica = el('div', 'vA-dica');
    var seguirBtn = el('button', 'vA-seguir');
    seguirBtn.type = 'button';
    var teclas = el('div', 'vA-teclas', '<span><kbd>→</kbd> segue</span><span><kbd>←</kbd> agora não</span><span><kbd>espaço</kbd> vira</span><span><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> casas</span>');
    pe.appendChild(dica);
    pe.appendChild(seguirBtn);
    pe.appendChild(teclas);

    var dest = el('aside', 'vA-destravado');
    var destCab = el('div', 'vA-dest-cab');
    var destFechar = el('button', 'vA-dest-fechar', 'Voltar à carta');
    destFechar.type = 'button';
    destFechar.addEventListener('click', function () { mesa.classList.remove('vA-rastro-aberto'); });
    var slot = el('div', 'vA-slot', '<span class="vA-slot-seta">→</span><span>Solte aqui a carta do centro para <b>seguir a recomendação</b></span>');
    var rastro = el('ol', 'vA-rastro');
    var adiadasEl = el('div', 'vA-adiadas');
    dest.appendChild(destCab);
    dest.appendChild(destFechar);
    dest.appendChild(slot);
    dest.appendChild(rastro);
    dest.appendChild(adiadasEl);

    var aviso = el('div', 'vA-aviso');

    mesa.appendChild(faixa);
    mesa.appendChild(centroEl);
    mesa.appendChild(pe);
    mesa.appendChild(dest);
    mesa.appendChild(aviso);
    vista.appendChild(mesa);

    // ------------------------------------------------------------------ utilidades
    function estreita() { return vista.clientWidth <= 640; }
    function naMesa() { return pilhas.trava.length + pilhas.hoje.length + pilhas.espera.length + (centro ? 1 : 0); }
    function cartasTxt(n) { return n === 1 ? '1 carta' : n + ' cartas'; }
    function indice() { return O.ROMANOS[destravados.length + adiadas.length] + ' · ' + O.ROMANOS[total - 1]; }
    function precisaSegurar(card) {
      return card.resposta.tipo === 'segurar' && card.resposta.caminhos.some(function (c) { return c.rec && c.segurar; });
    }
    function clamp(x) { return Math.max(0, Math.min(1, x)); }
    function avisar(txt) {
      aviso.textContent = txt;
      aviso.classList.add('on');
      clearTimeout(aviso._h);
      aviso._h = setTimeout(function () { aviso.classList.remove('on'); }, 3200);
    }
    // Rola só a carta (scrollIntoView rolaria também a vista, que tem overflow escondido).
    function rolarAte(alvo) {
      var rol = alvo && alvo.closest('.oc-rolagem');
      if (!rol) return;
      rol.scrollTop += alvo.getBoundingClientRect().top - rol.getBoundingClientRect().top - rol.clientHeight / 3;
    }

    // ------------------------------------------------------------------ desenho
    function desenharLead() {
      var n = naMesa();
      lead.innerHTML = '<span class="vA-titulo">A tiragem</span>'
        + (n ? '<span class="vA-conta"><b>' + n + '</b> ' + (n === 1 ? 'carta' : 'cartas') + ' na mesa</span>'
             : '<span class="vA-conta"><b>Mesa limpa</b></span>')
        + '<span class="vA-sub">' + destravados.length + ' de ' + total + ' destravadas</span>';
    }

    function pilhaHtml(n, max) {
      var h = '<span class="vA-pilha' + (n ? '' : ' vazia') + '">';
      for (var i = Math.min(max, n) - 1; i >= 0; i--) h += '<span class="vA-dorso" style="--k:' + i + '">' + O.dorso().innerHTML + '</span>';
      if (n) h += '<b class="vA-n">' + n + '</b>';
      return h + '</span>';
    }

    function desenharCasas() {
      CASAS.forEach(function (c) {
        var b = botoesCasa[c.k];
        var p = pilhas[c.k];
        var ativa = centro && centro.casa === c.k;
        var topo = p[0];
        b.className = 'vA-casa vA-casa-' + c.k + (ativa ? ' vA-ativa' : '') + (p.length ? '' : ' vA-vazia') + (topo ? ' naipe-' + topo.naipe : '');
        b.disabled = !p.length;
        var estado = p.length
          ? (ativa ? 'a da vez saiu daqui · mais ' + cartasTxt(p.length) : cartasTxt(p.length))
          : (ativa ? 'a última está no centro' : 'vazia');
        b.innerHTML = '<span class="vA-casa-nome">' + esc(c.nome) + '</span>'
          + pilhaHtml(p.length, 3)
          + '<span class="vA-casa-topo">' + (topo ? '<span class="vA-glifo">' + O.GLIFOS[topo.naipe] + '</span><span class="vA-casa-perg">' + esc(topo.pergunta) + '</span>' : '') + '</span>'
          + '<span class="vA-casa-estado">' + esc(estado) + '</span>';
      });
      var nd = destravados.length;
      casaDest.className = 'vA-casa vA-casa-dest' + (nd ? '' : ' vA-vazia');
      casaDest.innerHTML = '<span class="vA-casa-nome">Destravado</span><span class="vA-pilha vA-pilha-dest"><i>✓</i>' + (nd ? '<b class="vA-n">' + nd + '</b>' : '') + '</span><span class="vA-casa-topo"></span>';
    }

    function desenharDestravado(novo) {
      destCab.innerHTML = '<h3>Destravado' + (destravados.length ? '<b>' + destravados.length + '</b>' : '') + '</h3><p>O que esta tiragem já destravou.</p>';
      rastro.innerHTML = '';
      destravados.forEach(function (d, i) {
        var li = el('li', 'vA-slip naipe-' + d.card.naipe + (novo && i === 0 ? ' vA-cai' : ''));
        li.innerHTML = '<span class="vA-glifo">' + O.GLIFOS[d.card.naipe] + '</span><span>' + esc(d.card.destravaCurto) + '</span><i>✓</i>';
        li.addEventListener('animationend', function () { li.classList.remove('vA-cai'); });
        rastro.appendChild(li);
      });
      slot.classList.toggle('vA-slot-fim', !centro);
      adiadasEl.innerHTML = adiadas.length
        ? '<b>Fora da mesa sem decidir:</b> ' + adiadas.map(function (a) { return esc(a.card.destravaCurto) + ' <i>(volta ' + esc(a.quando) + ')</i>'; }).join(' · ')
        : '';
    }

    function desenharPe() {
      var n = naMesa();
      if (!centro) {
        pe.classList.add('vA-pe-fim');
        dica.innerHTML = '<span class="vA-pc">Nada mais espera por você.</span><span class="vA-cel">Mesa limpa. Nada mais espera por você.</span>';
        return;
      }
      pe.classList.remove('vA-pe-fim');
      dica.innerHTML = '<span class="vA-pc">Arraste a carta até <b>Destravado</b> →</span>'
        + '<span class="vA-cel"><b>' + cartasTxt(n) + ' na mesa</b> · arraste → segue · ← volta amanhã</span>';
      var pl = plano();
      seguirBtn.className = 'vA-seguir' + (pl.segurar ? ' vA-segurar' : '') + (pl.falta ? ' vA-falta' : '');
      seguirBtn.innerHTML = '<span class="vA-enche"></span><span class="vA-seguir-txt"><small>'
        + esc(pl.topo) + '</small><b>' + esc(pl.rotulo) + '</b></span><span class="vA-seta">→</span>';
    }

    // O que o gesto de destravar faz AGORA com a carta do centro. Segue a recomendação, a menos que
    // você já tenha mexido na carta: item do lote em "Mudar", texto editado, frase escrita.
    // Assim o botão dourado e o arrastar nunca jogam fora o que você mudou.
    function plano() {
      var card = centro.card, r = card.resposta, raiz = centro.raiz;
      if (raiz && r.tipo === 'lote') {
        var m = raiz.querySelectorAll('.oc-item.trocando').length;
        if (m) {
          var cam = 'Seguir com ' + (r.itens.length - m) + ', mudar ' + m;
          return { topo: 'Seguir com a sua mudança', rotulo: cam, res: { caminho: cam, rec: false } };
        }
      }
      if (raiz && r.tipo === 'texto') {
        var t = raiz.querySelector('.oc-msg-edit');
        if (t && t.value !== card._textoOriginal) {
          return { topo: 'Seguir com o seu texto', rotulo: 'Enviar editado', res: { caminho: 'Enviar editado', texto: t.value, rec: false } };
        }
        return { topo: 'Seguir a recomendação', rotulo: card.rec.rotulo, res: { caminho: card.rec.rotulo, texto: t ? t.value : '', rec: true } };
      }
      if (r.tipo === 'livre') {
        var ta = raiz && raiz.querySelector('.oc-resp-livre textarea');
        if (ta && ta.value.trim()) {
          return { topo: 'Seguir com a sua frase', rotulo: r.enviar, res: { caminho: r.enviar, texto: ta.value.trim(), rec: true } };
        }
        return { topo: 'Escreva na carta e siga', rotulo: card.rec.rotulo, falta: true, campo: ta };
      }
      var segurar = precisaSegurar(card);
      return { topo: segurar ? 'Não tem volta · segure até encher' : 'Seguir a recomendação', rotulo: card.rec.rotulo, segurar: segurar, res: { caminho: card.rec.rotulo, rec: true } };
    }

    function desenharCentro(origem) {
      centroEl.innerHTML = '';
      if (!centro) {
        var v = el('div', 'oc-vazia vA-vazia');
        var inner = el('div');
        inner.appendChild(O.dorso());
        inner.appendChild(el('b', null, 'O baralho está vazio.'));
        inner.appendChild(el('span', null, destravados.length
          ? 'Mesa limpa. Você destravou ' + (destravados.length === 1 ? '1 coisa' : destravados.length + ' coisas') + ' nesta tiragem.'
          : 'Mesa limpa. Nada precisa de você agora.'));
        v.appendChild(inner);
        centroEl.appendChild(v);
        return;
      }
      var card = centro.card;
      var wrap = el('div', 'vA-carta');
      var raiz = O.carta(card, {
        indice: indice(),
        aoDecidir: function (c, res) { decidir(c, res); },
        aoAgoraNao: function (c, quando) { agoraNao(quando); },
      });
      wrap.appendChild(raiz);
      wrap.appendChild(el('div', 'vA-carimbo sim', 'Destravado'));
      wrap.appendChild(el('div', 'vA-carimbo nao', 'Agora não'));
      centroEl.appendChild(wrap);
      centro.wrap = wrap;
      centro.raiz = raiz;
      desenharPe();   // o plano lê a carta montada (texto original, campos)
      // o botão dourado acompanha o que você muda dentro da carta
      raiz.addEventListener('input', function () { if (centro && centro.raiz === raiz) desenharPe(); });
      raiz.addEventListener('click', function () { setTimeout(function () { if (centro && centro.raiz === raiz && !saindo) desenharPe(); }, 0); });
      ligarArrasto(wrap);
      // a carta sai da casa de onde veio e vem para o centro
      if (origem && origem.getClientRects().length) {
        var r = wrap.getBoundingClientRect(), t = origem.getBoundingClientRect();
        if (r.width) {
          var s = Math.max(0.1, t.height / r.height);
          wrap.style.transition = 'none';
          wrap.style.opacity = '0.2';
          wrap.style.transform = 'translate(' + (t.left + t.width / 2 - r.left - r.width / 2) + 'px,' + (t.top + t.height / 2 - r.top - r.height / 2) + 'px) scale(' + s + ')';
          void wrap.offsetWidth;
          wrap.style.transition = 'transform .42s cubic-bezier(.2,.8,.3,1), opacity .3s ease';
          wrap.style.transform = '';
          wrap.style.opacity = '';
          setTimeout(function () { if (wrap.isConnected) wrap.style.transition = ''; }, 450);
        }
      }
    }

    function desenhar(opts) {
      opts = opts || {};
      desenharLead();
      desenharCasas();
      desenharPe();
      desenharDestravado(opts.novo);
      if (opts.centro !== false) desenharCentro(opts.casa ? botoesCasa[opts.casa].querySelector('.vA-pilha') : null);
    }

    // ------------------------------------------------------------------ tirar, decidir, adiar
    function puxarProxima() {
      for (var i = 0; i < CASAS.length; i++) {
        var k = CASAS[i].k;
        if (pilhas[k].length) { centro = { card: pilhas[k].shift(), casa: k }; return k; }
      }
      centro = null;
      return null;
    }

    function tirar(k) {
      if (saindo || !pilhas[k].length) return;
      if (centro) {
        if (centro.casa === k) pilhas[k].push(centro.card);     // mesma casa: a da vez vai para o fundo
        else pilhas[centro.casa].unshift(centro.card);          // outra casa: volta para o topo da dela
      }
      centro = { card: pilhas[k].shift(), casa: k };
      mesa.classList.remove('vA-rastro-aberto');
      desenhar({ casa: k });
    }

    function proxima() {
      var k = puxarProxima();
      desenhar({ novo: true, casa: k });
    }

    function voar(wrap, alvo, depois) {
      var r = wrap.getBoundingClientRect(), t = alvo.getBoundingClientRect(), c = centroEl.getBoundingClientRect();
      // centro da carta sem transformação (posição de layout) e centro de onde ela está agora
      var ux = c.left + wrap.offsetLeft + wrap.offsetWidth / 2, uy = c.top + wrap.offsetTop + wrap.offsetHeight / 2;
      var vx = r.left + r.width / 2, vy = r.top + r.height / 2;
      var s0 = (r.width && wrap._dx !== undefined && (wrap._dx || wrap._dy) && !estreita()) ? 0.45 : 1;
      var rot0 = (wrap._dx || 0) * (estreita() ? 0.05 : 0.02);
      wrap.style.transition = 'none';
      wrap.style.transformOrigin = '50% 50%';
      wrap.style.transform = 'translate(' + (vx - ux) + 'px,' + (vy - uy) + 'px) rotate(' + rot0 + 'deg) scale(' + s0 + ')';
      void wrap.offsetWidth;
      var s = Math.max(0.08, Math.min(0.4, t.height / (wrap.offsetHeight || 1)));
      wrap.classList.add('vA-voando');
      wrap.style.transition = 'transform .55s cubic-bezier(.45,0,.25,1), opacity .55s ease-in';
      wrap.style.transform = 'translate(' + (t.left + t.width / 2 - ux) + 'px,' + (t.top + t.height / 2 - uy) + 'px) rotate(8deg) scale(' + s + ')';
      wrap.style.opacity = '0.15';
      setTimeout(function () {
        alvo.classList.add('vA-recebe');
        setTimeout(function () { alvo.classList.remove('vA-recebe'); }, 500);
        depois();
      }, 560);
    }

    function decidir(card, res) {
      if (saindo || !centro || centro.card !== card) return;
      saindo = true;
      res.tipo = res.tipo || 'decidiu';
      var alvo = estreita() ? casaDest.querySelector('.vA-pilha') : slot;
      voar(centro.wrap, alvo, function () {
        destravados.unshift({ card: card, res: res });
        centro = null;
        saindo = false;
        O.toast(vista, card, res);
        proxima();
      });
    }

    function agoraNao(quando) {
      if (saindo || !centro) return;
      saindo = true;
      var card = centro.card, wrap = centro.wrap;
      wrap.style.transition = 'none';
      wrap.classList.add('oc-sai-esquerda');
      setTimeout(function () {
        adiadas.push({ card: card, quando: quando });
        centro = null;
        saindo = false;
        O.toast(vista, card, { tipo: 'agora-nao', quando: quando });
        proxima();
      }, 460);
    }

    // Seguir a recomendação num gesto só. Devolve false quando o gesto não basta (a carta volta ao centro).
    function seguir(opts) {
      opts = opts || {};
      if (!centro || saindo) return false;
      var card = centro.card, pl = plano();
      if (pl.falta) {
        avisar('Esta pede uma frase sua: escreva na carta o que mudou e siga de novo.');
        if (pl.campo) { rolarAte(pl.campo); pl.campo.focus({ preventScroll: true }); }
        return false;
      }
      if (pl.segurar && !opts.segurou) {
        avisar('Esta não tem volta: segure o botão dourado até ele encher.');
        seguirBtn.classList.remove('vA-pulsa');
        void seguirBtn.offsetWidth;
        seguirBtn.classList.add('vA-pulsa');
        return false;
      }
      pl.res.tipo = 'decidiu';
      decidir(card, pl.res);
      return true;
    }

    // ------------------------------------------------------------------ botão dourado (clique ou segurar)
    var holdTimer = null, segurou = false;
    seguirBtn.addEventListener('pointerdown', function (e) {
      if (!centro || !precisaSegurar(centro.card)) return;
      e.preventDefault();
      segurou = false;
      seguirBtn.classList.add('vA-segurando');
      holdTimer = setTimeout(function () { segurou = true; seguirBtn.classList.remove('vA-segurando'); seguir({ segurou: true }); }, 1200);
    });
    function soltarBotao() { clearTimeout(holdTimer); seguirBtn.classList.remove('vA-segurando'); }
    seguirBtn.addEventListener('pointerup', soltarBotao);
    seguirBtn.addEventListener('pointerleave', soltarBotao);
    seguirBtn.addEventListener('click', function () {
      seguirBtn.blur();
      if (segurou) { segurou = false; return; }
      seguir();
    });

    // ------------------------------------------------------------------ arrastar a carta
    function sobreAlvo(x, y) {
      var r = dest.getBoundingClientRect();
      return x >= r.left - 30 && x <= r.right + 30 && y >= r.top - 30 && y <= r.bottom + 30;
    }
    function limite(wrap) { return Math.min(120, wrap.offsetWidth * 0.28); }
    function voltarAoCentro(wrap) {
      wrap.style.transition = 'transform .3s cubic-bezier(.2,.9,.3,1.2)';
      wrap.style.transform = '';
      wrap._dx = wrap._dy = 0;
      setTimeout(function () { if (!wrap.style.transform) wrap.style.transformOrigin = ''; }, 320);
      wrap.querySelectorAll('.vA-carimbo').forEach(function (c) { c.style.opacity = ''; });
    }

    function ligarArrasto(wrap) {
      var d = null;
      var sim = wrap.querySelector('.vA-carimbo.sim'), nao = wrap.querySelector('.vA-carimbo.nao');
      wrap.addEventListener('pointerdown', function (e) {
        if (saindo || e.button > 0) return;
        if (e.target.closest('button, textarea, input, select, label, summary, a, output, .oc-tela-aberta')) return;
        d = { id: e.pointerId, x: e.clientX, y: e.clientY, dx: 0, dy: 0, on: false, swipe: estreita() };
      });
      wrap.addEventListener('pointermove', function (e) {
        if (!d || e.pointerId !== d.id) return;
        d.dx = e.clientX - d.x;
        d.dy = e.clientY - d.y;
        if (!d.on) {
          if (Math.abs(d.dx) < 8 && Math.abs(d.dy) < 8) return;
          if (d.swipe && Math.abs(d.dy) > Math.abs(d.dx)) { d = null; return; }   // vertical: é rolar a carta
          d.on = true;
          try { wrap.setPointerCapture(d.id); } catch (_) { /* sem captura */ }
          if (!d.swipe) {   // no PC a carta encolhe em volta do ponto onde você a pegou
            var rr = wrap.getBoundingClientRect();
            wrap.style.transformOrigin = (d.x - rr.left) + 'px ' + (d.y - rr.top) + 'px';
          }
          var sel = window.getSelection && window.getSelection();
          if (sel) sel.removeAllRanges();
          mesa.classList.add('vA-arrastando');
        }
        e.preventDefault();
        var dy = d.swipe ? d.dy * 0.12 : d.dy;
        wrap._dx = d.dx;
        wrap._dy = dy;
        wrap.style.transition = 'none';
        wrap.style.transform = 'translate(' + d.dx + 'px,' + dy + 'px) rotate(' + (d.dx * (d.swipe ? 0.05 : 0.02)) + 'deg)' + (d.swipe ? '' : ' scale(.45)');
        if (d.swipe) {
          var lim = limite(wrap);
          sim.style.opacity = clamp(d.dx / lim);
          nao.style.opacity = clamp(-d.dx / lim);
        } else {
          var over = sobreAlvo(e.clientX, e.clientY);
          dest.classList.toggle('vA-alvo', over);
          sim.style.opacity = over ? 1 : clamp(d.dx / 500) * 0.5;
          nao.style.opacity = 0;
        }
      });
      function soltar(e, cancelou) {
        if (!d || e.pointerId !== d.id) return;
        var x = d;
        d = null;
        mesa.classList.remove('vA-arrastando');
        dest.classList.remove('vA-alvo');
        if (!x.on) return;
        if (!cancelou) {
          if (x.swipe) {
            var lim = limite(wrap);
            if (x.dx > lim && seguir()) return;
            if (x.dx < -lim) { agoraNao('amanhã cedo'); return; }
          } else if (sobreAlvo(e.clientX, e.clientY) && seguir()) {
            return;
          }
        }
        voltarAoCentro(wrap);
      }
      wrap.addEventListener('pointerup', function (e) { soltar(e, false); });
      wrap.addEventListener('pointercancel', function (e) { soltar(e, true); });
    }

    // ------------------------------------------------------------------ teclado (só a primeira vista PC, visível)
    function minhaVez() {
      if (!vista.isConnected || !vista.getClientRects().length) return false;
      var primeira = document.querySelector('.pc .vista') || document.querySelector('.vista');
      return primeira === vista;
    }
    function tecla(e) {
      if (!vista.isConnected) { document.removeEventListener('keydown', tecla); return; }
      if (!minhaVez() || e.altKey || e.ctrlKey || e.metaKey) return;
      var t = e.target;
      if ((t.matches && t.matches('input, textarea, select, button')) || t.isContentEditable) return;
      if (e.key === 'ArrowRight') { e.preventDefault(); seguir(); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); agoraNao('amanhã cedo'); }
      else if (e.key === ' ' && centro) { e.preventDefault(); centro.raiz.classList.toggle('virada'); }
      else if (e.key === '1' || e.key === '2' || e.key === '3') { tirar(CASAS[+e.key - 1].k); }
    }
    document.addEventListener('keydown', tecla);

    // ------------------------------------------------------------------ dar as cartas
    puxarProxima();
    desenhar({});
  },
};

</script>
<script>
/* variante B */
/* Variante B — UMA CARTA POR VEZ. O baralho puro: a carta da vez, o índice e os dorsos que restam.
   Arrastar para a direita segue a recomendação; para a esquerda, "Agora não" (volta amanhã cedo).
   Zero estado global: tudo vive no fechamento de cada montar(). */
window.VARIANTES.B = {
  nome: 'Uma carta por vez',
  sobre: 'O baralho puro, no PC e no celular: só a carta da vez, o índice e os dorsos do que resta, '
    + 'com o que trava tudo primeiro. Destravar é arrastar a carta para a direita (segue a recomendação) '
    + 'ou para a esquerda (agora não, volta amanhã cedo); no PC as setas fazem o mesmo e o espaço vira a carta.',
  montar: function (vista, cartas) {
    var O = window.Oraculo;
    var el = O.el, esc = O.esc;

    // Ordem: o que trava tudo primeiro (peso), depois o parado (urgente), depois a ordem de chegada.
    var fila = cartas.map(function (c, i) { return { c: c, i: i }; }).sort(function (a, b) {
      return (b.c.peso || 0) - (a.c.peso || 0) || (b.c.urgente ? 1 : 0) - (a.c.urgente ? 1 : 0) || a.i - b.i;
    }).map(function (x) { return x.c; });
    var total = fila.length;
    var pos = 0;          // quantas já saíram da mesa
    var saindo = false;   // trava enquanto uma carta voa
    var atual = null;     // { card, wrap, carta, carimbo }

    var mesa = el('div', 'vB-mesa');
    var dEsq = el('button', 'vB-dica esq', '<span class="seta">←</span><span class="txt"><b>Agora não</b><small>volta amanhã cedo</small></span><kbd>←</kbd>');
    var dDir = el('button', 'vB-dica dir', '<span class="seta">→</span><span class="txt"><b>Seguir a recomendação</b><small class="rec"></small></span><kbd>→</kbd>');
    dEsq.type = dDir.type = 'button';
    var pilha = el('div', 'vB-pilha');
    var espaco = el('div', 'vB-espaco', '<kbd>espaço</kbd> vira a carta');
    mesa.appendChild(dEsq);
    mesa.appendChild(pilha);
    mesa.appendChild(dDir);
    mesa.appendChild(espaco);
    vista.appendChild(mesa);

    dEsq.addEventListener('click', function () { dEsq.blur(); agoraNao('amanhã cedo'); });
    dDir.addEventListener('click', function () { dDir.blur(); seguir(); });

    // ---------------------------------------------------------------- a carta da vez
    function rom(i) { return O.ROMANOS[i] || String(i + 1); }  // a base só tem romanos até XII
    function indice() { return rom(pos) + ' · ' + rom(total - 1); }

    // Quando arrastar à direita NÃO basta: resposta que pede frase, ou recomendação sem volta.
    function bloqueio(card) {
      var r = card.resposta;
      if (r.tipo === 'livre') {
        var ta = atual && atual.wrap.querySelector('.oc-resp-livre textarea');
        if (!ta || !ta.value.trim()) return { cls: 'aviso', t: 'Falta sua frase', s: 'escreva na carta e arraste de novo', foco: ta };
      }
      if (r.tipo === 'segurar') {
        var rc = r.caminhos.filter(function (c) { return c.rec && c.segurar; })[0];
        if (rc) return { cls: 'nao', t: 'Não tem volta', s: 'segure o botão na carta', foco: atual && atual.wrap.querySelector('.oc-segurar') };
      }
      return null;
    }
    function dicaDireita(card) {
      var r = card.resposta;
      if (r.tipo === 'livre') return 'Escreva na carta o que mudou, depois arraste';
      if (r.tipo === 'segurar' && r.caminhos.some(function (c) { return c.rec && c.segurar; })) return 'Esta não tem volta: segure o botão na carta';
      return card.rec.rotulo;
    }

    function mostrar() {
      pilha.innerHTML = '';
      pilha.style.setProperty('--vB-sobe', '0');
      atual = null;
      saindo = false;
      var resta = total - pos;
      mesa.classList.toggle('vB-fim', resta <= 0);
      if (resta <= 0) {
        var v = el('div', 'oc-vazia vB-vazia');
        var inner = el('div');
        inner.appendChild(O.dorso());
        inner.appendChild(el('b', null, 'O baralho está vazio.'));
        inner.appendChild(el('span', null, 'Nada precisa de você agora.'));
        v.appendChild(inner);
        pilha.appendChild(v);
        return;
      }
      // dorsos do que resta, atrás da carta
      var n = Math.min(3, resta - 1);
      for (var k = n; k >= 1; k--) {
        var d = O.dorso();
        d.classList.add('vB-dorso', 'vB-d' + k);
        pilha.appendChild(d);
      }
      var card = fila[pos];
      var wrap = el('div', 'vB-atual vB-entra');
      var c = O.carta(card, {
        indice: indice(),
        aoDecidir: function (cd, res) { sair('direita', res); },
        aoAgoraNao: function (cd, quando) { sair('esquerda', { tipo: 'agora-nao', quando: quando }); },
      });
      wrap.appendChild(c);
      var carimbo = el('div', 'vB-carimbo');
      wrap.appendChild(carimbo);
      pilha.appendChild(wrap);
      atual = { card: card, wrap: wrap, carta: c, carimbo: carimbo };
      dDir.querySelector('.rec').textContent = dicaDireita(card);
      ligarGesto(wrap);
      setTimeout(function () { wrap.classList.remove('vB-entra'); }, 400);
    }

    function pintarCarimbo(dir, forca, quando) {
      if (!atual) return;
      var k = atual.carimbo, card = atual.card;
      if (!dir) { k.className = 'vB-carimbo'; k.style.opacity = 0; k.style.translate = ''; pilha.style.setProperty('--vB-sobe', '0'); return; }
      var b = dir === 'direita' ? bloqueio(card) : null;
      var cls = dir === 'esquerda' ? 'esq' : b ? 'dir ' + b.cls : 'dir';
      var html = dir === 'esquerda' ? 'Agora não<small>volta ' + esc(quando || 'amanhã cedo') + '</small>'
        : b ? esc(b.t) + '<small>' + esc(b.s) + '</small>'
          : 'Destravado<small>' + esc(card.destravaCurto) + '</small>';
      if (k.dataset.html !== cls + html) { k.innerHTML = html; k.dataset.html = cls + html; }
      k.className = 'vB-carimbo ' + cls + (forca >= 1 ? ' pronto' : '');
      k.style.opacity = forca >= 1 ? 1 : Math.max(0, (forca - 0.35) / 0.65) * 0.55;
      dEsq.classList.toggle('acesa', dir === 'esquerda' && forca >= 1);
      dDir.classList.toggle('acesa', dir === 'direita' && forca >= 1 && !b);
      // a próxima do baralho sobe enquanto a carta da vez sai
      pilha.style.setProperty('--vB-sobe', b ? '0' : String(Math.min(1, Math.max(0, forca || 0))));
    }

    // ---------------------------------------------------------------- sair da mesa
    function sair(dir, res) {
      if (saindo || !atual) return;
      saindo = true;
      var a = atual, card = a.card;
      pintarCarimbo(dir, 1, res.quando);
      var w = vista.clientWidth || 800;
      a.wrap.style.transition = 'transform .38s ease-in, opacity .38s ease-in';
      a.wrap.style.transform = 'translateX(' + (dir === 'direita' ? w : -w) + 'px) rotate(' + (dir === 'direita' ? 16 : -16) + 'deg)';
      a.wrap.style.opacity = '0';
      // no PC o aviso aparece do lado para onde a carta foi
      mesa.classList.toggle('vB-saiu-dir', dir === 'direita');
      mesa.classList.toggle('vB-saiu-esq', dir === 'esquerda');
      O.toast(vista, card, res);
      setTimeout(function () {
        dEsq.classList.remove('acesa');
        dDir.classList.remove('acesa');
        pos++;
        mostrar();
      }, 380);
    }
    function seguir() {
      if (saindo || !atual) return;
      var card = atual.card;
      var b = bloqueio(card);
      if (b) { recusar(b); return; }
      var r = card.resposta;
      if (r.tipo === 'livre') {
        var ta = atual.wrap.querySelector('.oc-resp-livre textarea');
        sair('direita', { caminho: r.enviar, texto: ta.value.trim(), rec: true, tipo: 'decidiu' });
        return;
      }
      if (r.tipo === 'lote' && atual.wrap.querySelector('.oc-item.trocando')) {
        // o dono mexeu em algum item: arrastar confirma o que está na carta, não as cinco
        atual.wrap.querySelector('.oc-resp-lote > .oc-btn.ouro').click();
        return;
      }
      if (r.tipo === 'texto') {
        var t = atual.wrap.querySelector('.oc-msg-edit');
        if (t && t.value !== card._textoOriginal) { sair('direita', { caminho: 'Enviar editado', texto: t.value, rec: false, tipo: 'decidiu' }); return; }
      }
      sair('direita', { caminho: card.rec.rotulo, rec: true, tipo: 'decidiu' });
    }
    function agoraNao(quando) {
      if (saindo || !atual) return;
      sair('esquerda', { tipo: 'agora-nao', quando: quando });
    }
    function recusar(b) {
      var a = atual;
      pintarCarimbo('direita', 1);
      a.carimbo.style.translate = '';  // a carta volta ao centro; o carimbo também
      a.wrap.style.transition = 'transform .3s cubic-bezier(.3,1.6,.5,1)';
      a.wrap.style.transform = '';
      a.wrap.classList.remove('vB-treme');
      void a.wrap.offsetWidth;
      a.wrap.classList.add('vB-treme');
      a.carta.classList.remove('virada');
      setTimeout(function () {
        if (atual !== a) return;
        pintarCarimbo(null);
        dDir.classList.remove('acesa');
        if (b.foco) {
          rolarAte(b.foco);
          b.foco.classList.add('vB-aponta');
          setTimeout(function () { b.foco.classList.remove('vB-aponta'); }, 1600);
          if (b.foco.tagName === 'TEXTAREA') b.foco.focus({ preventScroll: true });
        }
      }, 900);
    }

    // Rola só a carta até o alvo. scrollIntoView rolaria também a página e a vista (overflow hidden).
    function rolarAte(alvo) {
      var rol = alvo.closest('.oc-rolagem');
      if (!rol) return;
      var rr = rol.getBoundingClientRect(), ar = alvo.getBoundingClientRect();
      rol.scrollTo({ top: rol.scrollTop + (ar.top - rr.top) - Math.max(0, (rr.height - ar.height) / 2), behavior: 'smooth' });
    }

    // ---------------------------------------------------------------- o gesto (mouse e dedo)
    var INTERATIVO = 'button, textarea, input, select, label, a, summary, output, .oc-saidas-painel';
    function ligarGesto(wrap) {
      var ini = null, arrastando = false, dx = 0;
      function limiar() { return Math.max(80, wrap.clientWidth * 0.28); }
      wrap.addEventListener('pointerdown', function (e) {
        if (saindo || e.button > 0) return;
        if (e.target.closest(INTERATIVO)) return;
        ini = { x: e.clientX, y: e.clientY, id: e.pointerId };
        arrastando = false;
        dx = 0;
      });
      wrap.addEventListener('pointermove', function (e) {
        if (!ini || e.pointerId !== ini.id) return;
        var mx = e.clientX - ini.x, my = e.clientY - ini.y;
        if (!arrastando) {
          if (Math.abs(mx) > 8 && Math.abs(mx) > Math.abs(my) * 1.2) {
            arrastando = true;
            try { wrap.setPointerCapture(e.pointerId); } catch (_) { /* sem captura, segue */ }
            wrap.classList.add('vB-arrastando');
            wrap.style.transition = 'none';
            var s = window.getSelection && window.getSelection();
            if (s) s.removeAllRanges();
          } else if (Math.abs(my) > 12) { ini = null; return; }
          else return;
        }
        e.preventDefault();
        dx = mx;
        wrap.style.transform = 'translateX(' + dx + 'px) rotate(' + (dx / 22) + 'deg)';
        pintarCarimbo(dx > 0 ? 'direita' : dx < 0 ? 'esquerda' : null, Math.abs(dx) / limiar());
        // o carimbo anda menos que a carta, para não sair da tela no celular
        if (atual) atual.carimbo.style.translate = Math.round(-dx * 0.55) + 'px 0';
      });
      function soltar(e) {
        if (!ini || (e && e.pointerId !== ini.id)) return;
        ini = null;
        if (!arrastando) return;
        arrastando = false;
        wrap.classList.remove('vB-arrastando');
        if (Math.abs(dx) >= limiar()) {
          if (dx > 0) seguir(); else agoraNao('amanhã cedo');
          return;
        }
        wrap.style.transition = 'transform .3s cubic-bezier(.3,1.5,.5,1)';
        wrap.style.transform = '';
        pintarCarimbo(null);
        dEsq.classList.remove('acesa');
        dDir.classList.remove('acesa');
      }
      wrap.addEventListener('pointerup', soltar);
      wrap.addEventListener('pointercancel', soltar);
    }

    // ---------------------------------------------------------------- teclado (só a primeira vista do PC)
    function donaDoTeclado() {
      if (!vista.isConnected) return false;
      if (!vista.getClientRects().length) return false;
      var primeira = document.querySelector('.pc .vista') || document.querySelector('.vista');
      return primeira === vista;
    }
    function tecla(e) {
      if (!vista.isConnected) { document.removeEventListener('keydown', tecla); return; }
      if (!donaDoTeclado() || e.altKey || e.ctrlKey || e.metaKey) return;
      var t = e.target;
      if ((t.matches && t.matches('input, textarea, select')) || t.isContentEditable) {
        // Esc devolve o teclado à mesa (depois de escrever a frase, → segue)
        if (e.key === 'Escape' && atual && atual.wrap.contains(t)) t.blur();
        return;
      }
      if (!atual || saindo) return;
      if (e.key === 'ArrowRight') { e.preventDefault(); seguir(); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); agoraNao('amanhã cedo'); }
      else if (e.key === ' ' || e.code === 'Space') { e.preventDefault(); atual.carta.classList.toggle('virada'); }
    }
    document.addEventListener('keydown', tecla);

    mostrar();
  },
};

</script>
<script>
/* variante C */
/* Variante C — MÃO E MESA. Um jogo de cartas: o dono segura a mão inteira (todas as cartas fechadas, em leque)
   e joga UMA na mesa. Na mesa, dois lugares marcados: o dourado (seguir a recomendação) e "Mais tarde".
   Arrastar a carta aberta para o dourado destrava; para "Mais tarde", ela volta ao fim da mão, esmaecida.
   No celular: a mão vira uma fileira no rodapé e o gesto único é o botão dourado no pé da carta.
   Zero estado global: tudo vive no fechamento de cada montar(). */
window.VARIANTES.C = {
  nome: 'Mão e mesa',
  sobre: 'Um jogo de cartas: você vê a mão inteira o tempo todo (quantas e quais decisões tem) e escolhe a ordem, '
    + 'jogando uma carta na mesa. Destravar é arrastar a carta aberta para o lugar dourado, que segue a recomendação; '
    + '"Mais tarde" devolve a carta ao fim da mão, esmaecida. No celular a mão é a fileira do rodapé e o gesto é o botão dourado.',
  montar: function (vista, cartas) {
    var O = window.Oraculo;
    var el = O.el, esc = O.esc;

    // ---------------------------------------------------------------- estado (só deste montar)
    var ordem = cartas.map(function (c, i) { return { c: c, i: i }; }).sort(function (a, b) {
      return (b.c.peso || 0) - (a.c.peso || 0) || (b.c.urgente ? 1 : 0) - (a.c.urgente ? 1 : 0) || a.i - b.i;
    }).map(function (x) { return x.c; });
    var pos = {};
    ordem.forEach(function (c, i) { pos[c.id] = i; });
    var total = ordem.length;
    var mao = ordem.slice();     // cartas na mão, na ordem em que aparecem
    var tarde = {};              // id -> quando (cartas adiadas: ficam no fim da mão, esmaecidas)
    var feitas = 0;              // quantas saíram da mesa decididas
    var jogada = null;           // { card, wrap }
    var ocupado = false;         // trava enquanto uma carta voa

    // ---------------------------------------------------------------- esqueleto
    var raiz = el('div', 'vC-raiz');
    var mesa = el('div', 'vC-mesa');
    var topo = el('div', 'vC-topo');
    var lTarde = el('button', 'vC-lugar vC-lugar-tarde',
      '<span class="vC-lugar-ic">☾</span><b>Mais tarde</b><small>volta amanhã cedo, no fim da sua mão</small>'
      + '<span class="vC-lugar-dica">arraste a carta aqui<kbd>←</kbd></span>');
    var lSeguir = el('button', 'vC-lugar vC-lugar-seguir',
      '<span class="vC-lugar-ic">✓</span><b class="vC-seg-tit">Seguir a recomendação</b><small class="vC-seg-sub"></small>'
      + '<span class="vC-lugar-dica"><span class="vC-seg-dica">arraste a carta aqui</span><kbd>→</kbd></span>');
    lTarde.type = lSeguir.type = 'button';
    var centro = el('div', 'vC-centro');
    var alvo = el('div', 'vC-alvo');
    centro.appendChild(alvo);
    var bSeguir = el('button', 'vC-seguir-btn', '<b class="vC-seg-tit">Seguir a recomendação</b><small class="vC-seg-sub"></small>');
    bSeguir.type = 'button';
    var pe = el('div', 'vC-pe');
    pe.appendChild(bSeguir);

    mesa.appendChild(topo);
    mesa.appendChild(lTarde);
    mesa.appendChild(centro);
    mesa.appendChild(lSeguir);
    mesa.appendChild(pe);

    var maoBox = el('div', 'vC-mao');
    var maoRot = el('div', 'vC-mao-rot');
    var leque = el('div', 'vC-leque');
    var devolver = el('div', 'vC-devolver', 'Solte para devolver à mão');
    maoBox.appendChild(maoRot);
    maoBox.appendChild(leque);
    maoBox.appendChild(devolver);

    raiz.appendChild(mesa);
    raiz.appendChild(maoBox);
    vista.appendChild(raiz);

    function celular() { return vista.clientWidth <= 640; }
    function ativas() { return mao.filter(function (c) { return !tarde[c.id]; }); }

    // ---------------------------------------------------------------- contagem
    function contar() {
      var at = ativas().length + (jogada ? 1 : 0);
      var nt = Object.keys(tarde).length;
      topo.innerHTML = '<span class="vC-topo-n"><b>' + at + '</b> ' + (at === 1 ? 'carta espera' : 'cartas esperam') + ' você</span>'
        + '<span class="vC-topo-x">' + (feitas ? feitas + (feitas === 1 ? ' destravada' : ' destravadas') : 'nenhuma destravada ainda')
        + (nt ? ' · ' + nt + ' para mais tarde' : '') + '</span>';
      var nm = mao.length;
      maoRot.innerHTML = '<b>Sua mão</b> · ' + (nm ? nm + (nm === 1 ? ' carta' : ' cartas') : 'vazia')
        + (nm ? '<span class="vC-mao-dica"> · ' + (celular() ? 'toque para abrir' : 'arraste uma para a mesa, ou clique') + '</span>' : '');
    }

    // ---------------------------------------------------------------- a mão
    function desenharMao() {
      // Mede ANTES de inserir: uma leitura de layout depois de inserir pinta as cartas novas com --vC-x: 0,
      // e o leque inteiro fechava no centro e reabria (0,22 s) a cada jogada.
      var cel = celular();
      var W = leque.clientWidth;
      leque.innerHTML = '';
      mao.forEach(function (card, i) {
        var w = el('div', 'vC-namao' + (tarde[card.id] ? ' vC-adiada' : ''));
        w.dataset.carta = card.id;
        var m = O.mini(card);
        m.setAttribute('aria-label', 'Abrir: ' + card.pergunta);
        w.appendChild(m);
        if (tarde[card.id]) w.appendChild(el('span', 'vC-volta', 'volta ' + esc(tarde[card.id])));
        if (!cel && i < 9) w.appendChild(el('kbd', 'vC-num', String(i + 1)));
        arrastarDaMao(w, card);
        leque.appendChild(w);
      });
      leque.classList.toggle('vC-vazio', !mao.length);
      if (!mao.length) leque.appendChild(el('div', 'vC-mao-vazia', 'Nenhuma carta na mão.'));
      leque_(W);
      contar();
    }

    // Leque: posição, giro e curva de cada carta (só vale no PC; no celular a CSS ignora estas variáveis).
    function leque_(largLeque) {
      var itens = leque.querySelectorAll('.vC-namao');
      var n = itens.length;
      if (!n) return;
      var W = largLeque || leque.clientWidth || 1000;
      var cw = 190;
      var passo = n > 1 ? Math.min(cw * 0.9, (W - cw - 40) / (n - 1)) : 0;
      var meio = (n - 1) / 2;
      var giro = Math.min(3, 14 / n);
      itens.forEach(function (it, i) {
        var d = i - meio;
        it.style.setProperty('--vC-x', (d * passo).toFixed(1) + 'px');
        it.style.setProperty('--vC-rot', (d * giro).toFixed(2) + 'deg');
        it.style.setProperty('--vC-y', (meio ? (d * d) * (9 / (meio * meio)) : 0).toFixed(1) + 'px');
        it.style.zIndex = String(10 + i);
      });
    }

    function arrastarDaMao(w, card) {
      var btn = w.querySelector('.oc-mini');
      var ini = null, arrastou = false;
      btn.addEventListener('click', function (e) {
        if (arrastou) { arrastou = false; e.preventDefault(); return; }
        jogar(card);
      });
      w.addEventListener('pointerdown', function (e) {
        if (celular() || ocupado || e.button > 0) return;
        ini = { x: e.clientX, y: e.clientY, id: e.pointerId };
        arrastou = false;
      });
      w.addEventListener('pointermove', function (e) {
        if (!ini || e.pointerId !== ini.id) return;
        var dx = e.clientX - ini.x, dy = e.clientY - ini.y;
        if (!arrastou && Math.hypot(dx, dy) < 7) return;
        if (!arrastou) { arrastou = true; try { w.setPointerCapture(e.pointerId); } catch (x) { /* ponteiro sintético */ } w.classList.add('vC-arrastando'); raiz.classList.add('vC-jogando'); }
        w.style.setProperty('--vC-dx', dx + 'px');
        w.style.setProperty('--vC-dy', dy + 'px');
        centro.classList.toggle('vC-quente', dentro(e, mesa) && !dentro(e, maoBox));
      });
      function soltar(e) {
        if (!ini || e.pointerId !== ini.id) return;
        ini = null;
        raiz.classList.remove('vC-jogando');
        centro.classList.remove('vC-quente');
        if (!arrastou) return;
        var naMesa = dentro(e, mesa) && !dentro(e, maoBox);
        w.classList.remove('vC-arrastando');
        if (naMesa) { jogar(card); return; }
        w.style.setProperty('--vC-dx', '0px');
        w.style.setProperty('--vC-dy', '0px');
      }
      w.addEventListener('pointerup', soltar);
      w.addEventListener('pointercancel', soltar);
    }

    function dentro(e, alvoEl) {
      var r = alvoEl.getBoundingClientRect();
      return e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
    }

    // ---------------------------------------------------------------- a mesa
    function indice() { return O.ROMANOS[Math.min(feitas, total - 1)] + ' · ' + O.ROMANOS[total - 1]; }

    function jogar(card) {
      if (ocupado) return;
      if (jogada && jogada.card.id === card.id) return;
      if (jogada) voltarParaMao(jogada.card, false);
      mao = mao.filter(function (c) { return c.id !== card.id; });
      delete tarde[card.id];
      var wrap = el('div', 'vC-jogada vC-entra');
      var c = O.carta(card, {
        indice: indice(),
        aoDecidir: function (cd, res) { sair(cd, res); },
        aoAgoraNao: function (cd, quando) { adiar(cd, quando); },
      });
      wrap.appendChild(c);
      centro.querySelectorAll('.vC-jogada').forEach(function (x) { x.remove(); });
      centro.appendChild(wrap);
      jogada = { card: card, wrap: wrap };
      arrastarJogada(wrap, card);
      wrap.addEventListener('input', atualizarRec);
      wrap.addEventListener('click', function () { setTimeout(atualizarRec, 0); });
      setTimeout(function () { wrap.classList.remove('vC-entra'); }, 420);
      desenharMao();
      estadoMesa();
    }

    function voltarParaMao(card, comAnim) {
      mao.push(card);
      mao.sort(function (a, b) { return (tarde[a.id] ? 1000 : 0) + pos[a.id] - ((tarde[b.id] ? 1000 : 0) + pos[b.id]); });
      if (jogada && jogada.card.id === card.id) { jogada.wrap.remove(); jogada = null; }
      if (comAnim) {
        desenharMao();
        var it = leque.querySelector('[data-carta="' + card.id + '"]');
        if (it) it.classList.add('vC-chega');
        estadoMesa();
      }
    }

    // O que o lugar dourado faz com a carta da vez (às vezes ele não basta: falta a frase, ou não tem volta).
    function avaliar(card) {
      var r = card.resposta;
      var cr = card._raiz;
      if (r.tipo === 'livre') {
        var ta = cr && cr.querySelector('.oc-resp-livre textarea');
        var txt = ta && ta.value.trim();
        if (!txt) return { ok: false, cls: 'aviso', tit: 'Falta a sua frase', sub: 'Escreva na carta o que mudou', dica: 'depois arraste aqui', foco: ta };
        return { ok: true, sub: r.enviar, res: { caminho: r.enviar, texto: txt, rec: true } };
      }
      if (r.tipo === 'segurar') {
        var rc = r.caminhos.filter(function (c) { return c.rec && c.segurar; })[0];
        if (rc) return { ok: false, cls: 'nao', tit: 'Esta não tem volta', sub: 'Segure “' + rc.rotulo + '” na carta', dica: 'o lugar dourado não decide o que não se desfaz', foco: cr && cr.querySelector('.oc-segurar') };
      }
      if (r.tipo === 'texto') {

        if (t && t.value !== card._textoOriginal) return { ok: true, sub: 'Enviar o texto que você editou', res: { caminho: 'Enviar editado', texto: t.value, rec: false } };

        if (m) { var s = 'Seguir com ' + (r.itens.length - m) + ', mudar ' + m; return { ok: true, sub: s, res: { caminho: s, rec: false } }; }
      }

    }

    function atualizarRec() {
      var a = jogada ? avaliar(jogada.card) : null;
      [lSeguir, bSeguir].forEach(function (b) {
        b.classList.toggle('vC-bloq', !!(a && !a.ok));
        b.classList.toggle('vC-bloq-nao', !!(a && a.cls === 'nao'));
        b.querySelector('.vC-seg-tit').textContent = a && !a.ok ? a.tit : 'Seguir a recomendação';
        b.querySelector('.vC-seg-sub').textContent = a ? a.sub : '';

      });
    }

    function estadoMesa() {
      var vazia = !jogada;
      mesa.classList.toggle('vC-sem-carta', vazia);
      alvo.innerHTML = '';
      if (vazia) {
        if (ativas().length) {
          alvo.className = 'vC-alvo vC-alvo-jogue';
          alvo.innerHTML = '<span class="vC-alvo-ic">' + (celular() ? '↓' : '↑') + '</span><b>Jogue uma carta aqui</b><span>'
            + (celular() ? 'Toque numa carta da sua mão, logo abaixo.' : 'Arraste uma carta da sua mão até a mesa, ou clique nela.') + '</span>';
        } else {
          alvo.className = 'vC-alvo oc-vazia';
          var inner = el('div');
          inner.appendChild(O.dorso());
          var nt = Object.keys(tarde).length;
          inner.appendChild(el('b', null, nt ? 'Mesa limpa.' : 'O baralho está vazio.'));
          inner.appendChild(el('span', null, nt
            ? 'Nada precisa de você agora. ' + (nt === 1 ? 'Uma carta volta' : nt + ' cartas voltam') + ' mais tarde; ' + (nt === 1 ? 'está esmaecida' : 'estão esmaecidas') + ' na sua mão.'
            : 'Nada precisa de você agora. Você destravou ' + feitas + (feitas === 1 ? ' decisão.' : ' decisões.')));
          alvo.appendChild(inner);
        }
      } else {
        alvo.className = 'vC-alvo';
      }
      atualizarRec();
      contar();
    }

    // ---------------------------------------------------------------- arrastar a carta aberta
    var INTERATIVO = 'button, textarea, input, select, a, summary, label, output, .oc-tela-aberta, .oc-saidas-painel';
    function arrastarJogada(wrap, card) {
      var ini = null, arr = false;
      wrap.addEventListener('pointerdown', function (e) {
        if (ocupado || e.button > 0) return;
        var t = e.target;
        if (t.closest(INTERATIVO)) return;
        if (e.pointerType !== 'mouse' && !t.closest('.oc-cabeca')) return; // no toque, só pela cabeça (o resto rola)
        if ((t.classList.contains('oc-rolagem') || t.classList.contains('oc-verso-corpo')) && e.offsetX > t.clientWidth) return; // barra de rolagem
        ini = { x: e.clientX, y: e.clientY, id: e.pointerId };
        arr = false;
        if (e.pointerType === 'mouse') e.preventDefault();
      });
      wrap.addEventListener('pointermove', function (e) {
        if (!ini || e.pointerId !== ini.id) return;
        var dx = e.clientX - ini.x, dy = e.clientY - ini.y;
        if (!arr && Math.hypot(dx, dy) < 8) return;
        if (!arr) { arr = true; try { wrap.setPointerCapture(e.pointerId); } catch (x) { /* ponteiro sintético */ } wrap.classList.add('vC-arrastando'); raiz.classList.add('vC-movendo'); }
        if (celular()) dx = dx * 0.35;
        wrap.style.transform = 'translate(' + dx + 'px,' + dy + 'px) rotate(' + (dx * 0.03).toFixed(2) + 'deg) scale(' + (celular() ? 1 : 0.92) + ')';
        var onde = alvoDe(e);
        lSeguir.classList.toggle('vC-quente', onde === 'seguir');
        lTarde.classList.toggle('vC-quente', onde === 'tarde');
        maoBox.classList.toggle('vC-quente', onde === 'mao');
      });
      function soltar(e) {
        if (!ini || e.pointerId !== ini.id) return;
        ini = null;
        raiz.classList.remove('vC-movendo');
        [lSeguir, lTarde, maoBox].forEach(function (x) { x.classList.remove('vC-quente'); });
        if (!arr) return;
        wrap.classList.remove('vC-arrastando');
        var onde = e.type === 'pointercancel' ? null : alvoDe(e);
        if (onde === 'seguir') { if (!seguir()) voltaAoLugar(wrap); return; }
        if (onde === 'tarde') { adiar(card, 'amanhã cedo'); return; }
        if (onde === 'mao') { devolver_(card); return; }
        voltaAoLugar(wrap);

      wrap.addEventListener('pointerup', soltar);
      wrap.addEventListener('pointercancel', soltar);
    }
    function alvoDe(e) {
      if (!celular() && dentro(e, lSeguir)) return 'seguir';
      if (!celular() && dentro(e, lTarde)) return 'tarde';
      if (dentro(e, maoBox)) return 'mao';
      return null;
    }
    function voltaAoLugar(wrap) {
      wrap.classList.add('vC-volta-lugar');
      wrap.style.transform = '';
      setTimeout(function () { wrap.classList.remove('vC-volta-lugar'); }, 320);
    }

    // Voo da carta aberta até um lugar da mesa (ou para cima/baixo no celular).
    function voar(wrap, destino, depois) {
      ocupado = true;
      var r = wrap.getBoundingClientRect();
      var tr;
      if (destino && typeof destino !== 'string' && !celular()) {
        var d = destino.getBoundingClientRect();
        tr = 'translate(' + (d.left + d.width / 2 - (r.left + r.width / 2)) + 'px,' + (d.top + d.height / 2 - (r.top + r.height / 2)) + 'px) scale(.28) rotate(' + (destino === lSeguir ? 8 : -8) + 'deg)';
      } else {
        tr = destino === 'baixo' ? 'translateY(70%) scale(.5)' : 'translateY(-90%) scale(.7)';
      }
      wrap.classList.add('vC-voando');
      // força o estilo atual antes de animar
      void wrap.offsetWidth;
      wrap.style.transform = tr;
      wrap.style.opacity = '0';
      setTimeout(function () { wrap.remove(); ocupado = false; depois(); }, 460);
    }

    function seguir() {
      if (!jogada || ocupado) return false;
      var a = avaliar(jogada.card);
      if (!a.ok) {
        var w = jogada.wrap;
        w.classList.remove('vC-treme'); void w.offsetWidth; w.classList.add('vC-treme');
        [lSeguir, bSeguir].forEach(function (b) { b.classList.remove('vC-pulsa'); void b.offsetWidth; b.classList.add('vC-pulsa'); });
        if (a.foco) { rolarAte(a.foco); if (a.foco.focus) a.foco.focus({ preventScroll: true }); }
        return false;
      }
      var res = a.res;
      res.tipo = 'decidiu';
      sair(jogada.card, res);
      return true;
    }

    // Rola só a carta (scrollIntoView rolaria também a vista e a página).
    function rolarAte(alvoEl) {
      var rol = alvoEl.closest('.oc-rolagem');
      if (!rol) return;
      var a = alvoEl.getBoundingClientRect(), r = rol.getBoundingClientRect();
      rol.scrollTo({ top: rol.scrollTop + (a.top - r.top) - (rol.clientHeight - a.height) / 2, behavior: 'smooth' });
    }

    function sair(card, res) {
      if (!jogada || jogada.card.id !== card.id || ocupado) return;
      var w = jogada.wrap;
      jogada = null;
      lSeguir.classList.add('vC-aceso');
      bSeguir.classList.add('vC-aceso');
      voar(w, lSeguir, function () {
        lSeguir.classList.remove('vC-aceso');
        bSeguir.classList.remove('vC-aceso');
        feitas++;
        O.toast(vista, card, res);
        proxima();
      });
      estadoMesa();
    }

    function adiar(card, quando) {
      if (!jogada || jogada.card.id !== card.id || ocupado) return;
      var w = jogada.wrap;
      jogada = null;
      voar(w, celular() ? 'baixo' : lTarde, function () {
        tarde[card.id] = quando;
        voltarParaMao(card, true);
        O.toast(vista, card, { tipo: 'agora-nao', quando: quando });
        proxima();
      });
      estadoMesa();
    }

    function devolver_(card) {
      if (!jogada || ocupado) return;
      var w = jogada.wrap;
      jogada = null;
      voar(w, 'baixo', function () { voltarParaMao(card, true); });
      estadoMesa();
    }

    // Depois de uma decisão, a próxima carta da mão (a que mais trava) vem para a mesa. O dono troca quando quiser.
    function proxima() {
      var at = ativas();
      if (at.length) jogar(at[0]);
      else { desenharMao(); estadoMesa(); }
    }

    // ---------------------------------------------------------------- botões, teclado, tamanho
    lSeguir.addEventListener('click', function () { seguir(); });
    bSeguir.addEventListener('click', function () { seguir(); });
    lTarde.addEventListener('click', function () { if (jogada) adiar(jogada.card, 'amanhã cedo'); });

    function principal() {
      var pc = document.querySelector('.pc-tela .vista');
      return (pc || document.querySelector('.vista')) === vista;
    }
    function tecla(e) {
      if (!vista.isConnected) { document.removeEventListener('keydown', tecla); return; }
      if (!principal() || !vista.offsetParent) return;
      var t = e.target;
      if ((t.matches && t.matches('input, textarea, select')) || t.isContentEditable) return;
      if (e.altKey || e.ctrlKey || e.metaKey) return;
      if (e.key === 'ArrowRight') { e.preventDefault(); seguir(); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); if (jogada) adiar(jogada.card, 'amanhã cedo'); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); if (jogada) devolver_(jogada.card); }
      else if (/^[1-9]$/.test(e.key)) { var c = mao[+e.key - 1]; if (c) jogar(c); }
    }
    document.addEventListener('keydown', tecla);

    var largura = vista.clientWidth;
    if (window.ResizeObserver) {
      var espera = null;
      var ro = new ResizeObserver(function () {
        if (!vista.isConnected) { ro.disconnect(); return; }
        // espera o tamanho assentar (um print de página inteira muda a janela por um instante)
        clearTimeout(espera);
        espera = setTimeout(function () {
          var w = vista.clientWidth;
          if (!w || w === largura) return;
          var mudouForma = (largura <= 640) !== (w <= 640);
          largura = w;
          if (mudouForma) { desenharMao(); estadoMesa(); } else leque_();
        }, 160);
      });
      ro.observe(vista);
    }

    // dar as cartas: a que mais trava já vem jogada
    jogar(ordem[0]);
  },
};
